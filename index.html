<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>GuardsPro AI Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: GuardsPro shell (sidebar · topbar · Schedule page) extended with an AI Scheduling workflow layer. Single dark theme, matching the product. */
:root{
  color-scheme:dark;
  --bg:#111a2b; --panel:#182032; --panel-2:#1e2739; --raise:#232d40; --pill:#2a3346; --pill-h:#343e54;
  --line:#2b3446; --line-2:#3a4459; --text:#eef1f6; --muted:#a2aabb; --dim:#727c90;
  --accent:#6f78ff; --accent-2:#5a62ef; --accent-soft:rgba(111,120,255,.15); --on-accent:#ffffff;
  --ok:#3ccf91; --ok-soft:rgba(60,207,145,.13); --warn:#f6b94b; --warn-soft:rgba(246,185,75,.13); --bad:#f2677a; --bad-soft:rgba(242,103,122,.13);
  --today:#4a5367; --card-ink:#18202e; --card-sub:#47506a;
  --c-cyan:#b8ebf7; --c-lilac:#efc6f3; --c-amber:#f7dfae; --c-mint:#c4eed3; --c-peri:#d0d7ff; --c-open:#fcc9c6; --c-unpub:#e2dfdc;
  --bar-pub:#ff9b1c; --bar-open:#ff1f9f; --bar-vac:#ff5a36; --bar-unpub:#8d95a6; --badge:#2f86ea;
  --shadow:0 18px 50px rgba(3,7,18,.55);
  --f-ui:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --f-num:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--text)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.sidebar{width:300px;flex:none;border-right:1px solid var(--line);background:var(--bg);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.logo{display:flex;align-items:center;gap:10px;height:96px;padding:0 30px;font-weight:700;font-size:29px;letter-spacing:-.5px}
.logo svg{width:38px;height:42px}
.nav{display:flex;flex-direction:column;padding:4px 16px 24px;gap:2px}
.nav a{display:flex;align-items:center;gap:22px;height:58px;padding:0 20px;border-radius:8px;font-weight:500;color:var(--text);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel)}
.nav a .ic{width:26px;height:26px;stroke-width:1.5;color:#c9cfdb}
.nav a .chev{margin-left:auto;width:18px;height:18px;color:var(--dim)}
.nav a.open{background:linear-gradient(90deg,#2e3a55,#1b2335);border-left:2px solid var(--accent)}
.nav .sub{display:flex;flex-direction:column;padding:8px 0 8px 68px;gap:4px}
.nav .sub a{height:48px;padding:0;font-size:14px}
.nav .sub a:hover{background:none;color:var(--accent)}
.nav .sub a.on{color:var(--accent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:78px;display:flex;align-items:center;gap:8px;padding:0 24px 0 32px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.topbar .tb{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:#c9cfdb;position:relative}
.topbar .tb:hover{background:var(--panel)}
.topbar .tb .ic{width:26px;height:26px;stroke-width:1.5}
.topbar .spacer{flex:1}
.bell-n{position:absolute;top:4px;right:2px;background:#13a385;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 5px;border:2px solid var(--bg)}
.avatar{width:46px;height:46px;border-radius:50%;background:#d7dbe3;display:grid;place-items:center;margin:0 14px 0 10px;flex:none;overflow:hidden}
.avatar svg{width:46px;height:46px}
.org{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:500;line-height:1.75}
.org-wrap{display:flex;align-items:center;gap:14px}
.page-head{height:90px;display:flex;align-items:center;padding:0 37px;border-bottom:1px solid var(--line);gap:14px}
.page-head h1{font-size:18px;font-weight:700;margin:0}
.crumb{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.crumb .ic{width:16px;height:16px}
.content{padding:24px 25px 120px;min-width:0}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.seg{display:flex;background:var(--panel);border-radius:4px;overflow:hidden}
.seg button{height:50px;padding:0 20px;font-size:16px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--today);color:var(--text)}
.datenav{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:4px}
.datenav > button{height:50px;padding:0 16px;color:var(--text);display:flex;align-items:center;gap:10px;font-size:16px}
.datenav .ttl{color:#c9cfdb;min-width:170px;justify-content:center}
.datenav .today{color:var(--muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.pillbtn{height:46px;min-width:66px;padding:0 20px;border-radius:24px;background:var(--pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px}
.pillbtn:hover{background:var(--pill-h)}
.pillbtn .ic{width:21px;height:21px;stroke-width:2.2}
.pillbtn.ai{background:var(--accent-2);color:var(--on-accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pillbtn.ai:hover,.pillbtn.ai[aria-expanded="true"]{background:var(--accent)}
.pillbtn .cnt{background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.iconbtn{width:40px;height:46px;display:grid;place-items:center;border-radius:6px}
.iconbtn:hover{background:var(--panel)}
.iconbtn .ic{width:24px;height:24px}

/* ---------- banners ---------- */
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:6px;margin-bottom:18px;border:1px solid}
.banner.unpub{background:var(--accent-soft);border-color:rgba(111,120,255,.4)}
.banner.pub{background:var(--ok-soft);border-color:rgba(60,207,145,.4)}
.banner .msg{flex:1;min-width:220px}
.banner .msg b{display:block;font-size:15px}
.banner .msg span{color:var(--muted);font-size:13px}
.banner .ic{width:22px;height:22px}
.chipbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--pill);font-size:13px}
.chip .ic{width:14px;height:14px}

/* ---------- buttons ---------- */
.btn{height:40px;padding:0 18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--accent-2);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent)}
.btn.primary:disabled{background:var(--pill);color:var(--dim);cursor:not-allowed}
.btn.ghost{background:var(--pill)}
.btn.ghost:hover{background:var(--pill-h)}
.btn.outline{box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.outline:hover{background:var(--panel-2)}
.btn.ok{background:#1f9d6c;color:#fff}
.btn.ok:hover{background:#25b27b}
.btn.danger{background:#c6435a;color:#fff}
.link{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}
.link .ic{width:16px;height:16px}

/* ---------- calendar ---------- */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
.cal{min-width:980px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dh{height:80px;display:grid;place-items:center;font-size:20px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .cell{min-height:150px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 8px 12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.cal .dh:nth-child(7n),.cal .cell:nth-child(7n){border-right:0}
.cal .cell.today{background:var(--today)}
.cal .cell.out .dnum{color:var(--dim)}
.cal.week .cell{min-height:420px}
.dnum{align-self:flex-end;font-weight:700;font-size:17px;margin:-4px 0 2px}
.dnum.btnlike{cursor:pointer}

.shift{position:relative;min-height:38px;border-radius:3px;background:var(--c-cyan);color:var(--card-ink);display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;cursor:pointer;font-size:13px;border-left:6px solid var(--bar-pub);transition:box-shadow .15s, opacity .15s, transform .15s}
.shift.s-cyan{background:var(--c-cyan)} .shift.s-lilac{background:var(--c-lilac)} .shift.s-amber{background:var(--c-amber)} .shift.s-mint{background:var(--c-mint)} .shift.s-peri{background:var(--c-peri)}
.shift.open{background:var(--c-open);border-left-color:var(--bar-open)}
.shift.vacant{background:var(--c-open);border-left-color:var(--bar-vac)}
.shift.unpub{background:var(--c-unpub);border-left-color:var(--bar-unpub)}
.shift .hc{position:absolute;left:-8px;top:-7px;background:var(--badge);color:#fff;font-size:10px;font-weight:700;min-width:13px;height:16px;border-radius:3px;display:grid;place-items:center;padding:0 2px}
.shift .body{flex:1;min-width:0;display:flex;flex-direction:column}
.shift .lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;word-break:break-word}
.shift .lbl b{white-space:nowrap}
.shift .lbl b{font-weight:500}
.shift .sub{font-size:12px;color:var(--card-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:1px 6px;border-radius:3px;line-height:15px}
.tag.unpub{background:#4b5264;color:#fff}
.tag.pub{background:#17845a;color:#fff}
.tag.ai{background:rgba(24,32,46,.12);color:var(--card-ink)}
.shift .kebab{width:22px;height:28px;display:grid;place-items:center;color:#5b6378;border-radius:3px;flex:none}
.shift .kebab:hover{background:rgba(0,0,0,.08)}
.shift .kebab .ic{width:18px;height:18px}
.shift .pick{width:28px;align-self:stretch;margin:-4px -4px -4px 0;background:#f58a96;display:grid;place-items:center;border-radius:0 3px 3px 0;flex:none}
.shift .pick i{width:19px;height:19px;border-radius:50%;border:2px solid #3237c9;display:grid;place-items:center}
.shift.selected .pick i::after{content:"";width:9px;height:9px;border-radius:50%;background:#3237c9}
.shift.confirmed .lbl::after{content:" \2713";font-weight:700;color:#178a5a}
/* AI select mode */
.mode-ai .shift.locked{opacity:.32;cursor:not-allowed;filter:saturate(.4)}
.mode-ai .shift.selectable{box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(111,120,255,.55)}
.mode-ai .shift.selectable:hover{transform:translateY(-1px)}
.shift.selected{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent),0 6px 18px rgba(111,120,255,.35)!important}
.mode-ai .shift.selected .pick{background:var(--accent)}
.mode-ai .shift.selected .pick i{border-color:#fff}
.mode-ai .shift.selected .pick i::after{background:#fff}
.mode-ai .shift.selectable .pick{background:#c9cdfb}
.shift.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--bg),0 0 0 6px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* day + list views */
.daylist{background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.daylist h3{margin:0 0 6px;font-size:18px}
.daylist .shift{min-height:52px;font-size:15px}
.empty{color:var(--muted);padding:24px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table.grid{width:100%;border-collapse:collapse;min-width:860px}
table.grid th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
table.grid td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:var(--raise)}
table.grid tr.selected td{background:var(--accent-soft)}
.mode-ai table.grid tr.locked td{opacity:.35}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st .ic{width:14px;height:14px;stroke-width:2.2}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.info{background:var(--accent-soft);color:#a9afff}
.st.muted{background:var(--pill);color:var(--muted)}

/* ---------- bottom bars ---------- */
.bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;background:#1b2232;border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:4px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 18px;width:min(1060px,calc(100% - 32px))}
.bbar .count{font-size:17px;font-weight:500}
.bbar .count small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.bbar .acts{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.bbar .acts .link{font-size:16px;font-weight:400}
.bbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bbar.ai{border-color:rgba(111,120,255,.6)}
.bbar .aihint{display:flex;align-items:center;gap:8px;color:#b6bbff;font-size:13px}
.bbar .aihint .ic{width:18px;height:18px}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:60;background:#1c2332;border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);min-width:240px;padding:6px 0}
.menu .mh{padding:10px 18px 10px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;gap:12px}
.menu button.mi{width:100%;display:flex;align-items:center;gap:16px;padding:0 20px;min-height:58px;font-size:16px;text-align:left;border-bottom:1px solid var(--line)}
.menu button.mi:last-child{border-bottom:0}
.menu button.mi:hover{background:var(--raise)}
.menu button.mi .ic{width:24px;height:24px;color:#d4d8e2}
.menu button.mi .t{display:flex;flex-direction:column;flex:1}
.menu button.mi .t small{color:var(--muted);font-size:12.5px}
.menu button.mi .chev{width:16px;height:16px;margin-left:auto}
.menu.ai-menu{width:330px}
.menu.ai-menu .mi .ic{color:#b6bbff}
.menu .subm{background:var(--panel-2)}
.menu .subm .mi{min-height:44px;padding-left:60px;font-size:14.5px}
.pop{position:fixed;z-index:60;background:#1c2332;border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);width:300px;padding:16px 18px}
.pop h4{margin:0 0 12px;font-size:14px}
.pop .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pop .kv:last-child{border-bottom:0}
.pop .kv span:first-child{color:var(--muted)}

/* ---------- modal + drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,9,18,.62);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal .mhd{padding:20px 24px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.modal .mhd h3{margin:0;font-size:18px}
.modal .mhd p{margin:4px 0 0;color:var(--muted);font-size:13px}
.modal .mhd .x{margin-left:auto}
.eyebrow{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:#a9afff;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.eyebrow .ic{width:14px;height:14px}
.modal .mbd{padding:20px 24px;overflow-y:auto}
.modal .mft{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .mft .left{margin-right:auto}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--raise);color:var(--text)}
.bigcount{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.bigcount b{font-size:40px;font-weight:700;line-height:1}
.bigcount span{color:var(--muted)}
.splits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.split{border-radius:6px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:500}
.split .ic{width:20px;height:20px;stroke-width:2.2}
.split.ok{background:var(--ok-soft);color:var(--ok)}
.split.warn{background:var(--warn-soft);color:var(--warn)}
.split b{font-size:20px}
.minilist{border:1px solid var(--line);border-radius:6px;max-height:280px;overflow-y:auto}
.minilist .r{display:grid;grid-template-columns:96px 104px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.minilist .r:last-child{border-bottom:0}
.minilist .r .m{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rulesum{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;background:var(--panel-2);border-radius:6px;font-size:13px;flex-wrap:wrap}
.rulesum .ic{width:20px;height:20px;color:#b6bbff}
.rulesum div{flex:1;min-width:180px}
.rulesum small{display:block;color:var(--muted)}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.note .ic{width:16px;height:16px;margin-top:1px}

.steps{display:flex;flex-direction:column;gap:12px;margin:8px 0 4px}
.step{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:14.5px}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);flex:none}
.step.done{color:var(--text)}
.step.done i{background:var(--ok);border-color:var(--ok);color:#0d2a1e}
.step.done i .ic{width:14px;height:14px;stroke-width:3}
.step.now{color:var(--text)}
.step.now i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:18px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:6px auto 16px}
.center{text-align:center}
.success-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:4px auto 14px}
.success-ic .ic{width:30px;height:30px;stroke-width:2.6}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sumgrid .t{background:var(--panel-2);border-radius:6px;padding:12px 14px}
.sumgrid .t b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.sumgrid .t span{font-size:12.5px;color:var(--muted)}
.sumgrid .t.ok b{color:var(--ok)} .sumgrid .t.warn b{color:var(--warn)} .sumgrid .t.bad b{color:var(--bad)}
.confirm-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}

/* toast */

@media (max-width:760px){.rm-wrap{padding:12px 8px}.rmodal{max-height:calc(100vh - 24px)}.rmodal .sf-split{grid-template-columns:1fr}.rmodal .radar-card{position:static;max-width:340px;margin:0 auto;width:100%}.rmodal .hr-grid{grid-template-columns:1fr}}

.radar{width:100%;height:auto;display:block;touch-action:none;user-select:none}

.rd-scale{fill:var(--dim);font-size:9px;font-family:var(--f-num)}

.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);border-radius:4px}
.frow:hover{background:var(--panel-2)}
.frow .rt b{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .rt small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.frow.off .rt b{color:var(--dim)}
.frow.confirm{grid-template-columns:minmax(0,1fr) auto;background:var(--bad-soft)}
.fr-confirm{display:flex;gap:8px}
.ctag{font-size:10.5px;font-weight:500;color:#b9beff;background:var(--accent-soft);border-radius:3px;padding:1px 6px}
.wctl{display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;background:var(--bg)}
.stepper button{width:30px;height:32px;font-size:17px;color:var(--muted)}
.stepper button:hover:not(:disabled){background:var(--raise);color:var(--text)}
.stepper button:disabled{cursor:not-allowed;opacity:.4}
.stepper input{width:38px;height:32px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:transparent;text-align:center;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.dis{opacity:.5}
.pct{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#c3c7ff}
.frow.off .pct{color:var(--dim);font-weight:400}
.fr-acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.frow:hover .fr-acts,.frow:focus-within .fr-acts{opacity:1}
@media (hover:none){.fr-acts{opacity:1}}
.x.sm{width:28px;height:28px}
.x.sm .ic{width:16px;height:16px}
.x.sm:disabled{opacity:.3;cursor:not-allowed}
.x.del:hover{color:var(--bad);background:var(--bad-soft)}
.addform{border:1px solid rgba(111,120,255,.45);background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.addform h5{margin:0 0 12px;font-size:13px;display:flex;align-items:center;gap:8px}
.addform h5 .ic{width:16px;height:16px;color:#b6bbff}
.af-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.factors td.fw{width:64px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;padding-right:8px}
.factors td.fw small{display:block;font-size:10.5px;color:var(--dim)}
@media (max-width:900px){.sf-split{grid-template-columns:1fr}.radar-card{position:static}.hr-grid{grid-template-columns:1fr}}
@media (max-width:560px){.frow{grid-template-columns:auto minmax(0,1fr);}.frow .wctl{grid-column:2}.frow .fr-acts{grid-column:2}}
@media (max-width:1180px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  .app.side-open .sidebar{transform:none;box-shadow:var(--shadow)}
  .mob-only{display:grid}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail-grid{grid-template-columns:1fr}
  .dpane + .dpane{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:760px){
  .topbar{padding:0 12px;gap:2px}
  .topbar .hide-sm{display:none}
  .org{display:none}
  .page-head{padding:0 16px;height:64px}
  .content{padding:16px 16px 140px}
  .seg button{padding:0 14px;font-size:15px;height:44px}
  .datenav > button{height:44px;padding:0 12px;font-size:15px}
  .datenav .ttl{min-width:0}
  .tools{margin-left:0;flex-wrap:wrap}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lists{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sumgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .splits{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .elig ul{grid-template-columns:1fr}
  .minilist .r{grid-template-columns:80px minmax(0,1fr) auto}
  .minilist .r .m2{display:none}
  .bbar{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- rules modal v3: sub-dialogs, chart header, in-place toggle states ---- */
.drawer-scrim.sub{z-index:88;background:rgba(5,9,18,.5)}
.rm-wrap.sub{z-index:89}
.rmodal.sm{max-width:520px}
.rmodal.zoom{max-width:920px}
.rmodal .frow,.rmodal .rule{transition:background-color .15s}
.rmodal .frow .rt,.rmodal .frow .wctl,.rmodal .rule .rt{transition:opacity .15s}
.rmodal .frow.off .rt,.rmodal .frow.off .wctl{opacity:.45}
.rmodal .rule.off .rt{opacity:.5}
.rmodal .rule.off .rt b{color:var(--muted)}
.rmodal .rule.custom{position:relative;padding-right:30px}
.rmodal .rule .hov{position:absolute;right:0;top:6px;opacity:0;transition:opacity .12s}
.rmodal .rule.custom:hover .hov,.rmodal .rule.custom:focus-within .hov{opacity:1}
@media (hover:none){.rmodal .rule .hov{opacity:1}}
.rmodal .rule.confirm{background:var(--bad-soft);border-radius:6px;padding:8px;align-items:center}
.rmodal .rule.confirm .rt b{font-size:12.5px}
.rmodal .ctl span{color:var(--muted)}
.justadded{animation:justadded 1.6s ease-out 1}
@keyframes justadded{0%{background:rgba(111,120,255,.28)}100%{background:transparent}}
.radar-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.rtag{font-size:11px;padding:2px 8px;border-radius:10px;background:#1E293B;color:var(--muted);border:1px solid #334155;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtag.strong{color:#c3c7ff;border-color:rgba(111,120,255,.5);background:var(--accent-soft);font-weight:700}
.rtag.ok{color:var(--ok);border-color:rgba(60,207,145,.4)}
.rzoom{margin-left:auto;width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.rzoom:hover{background:#1E293B;color:var(--text)}
.rzoom .ic{width:15px;height:15px}
.rd-bg{fill:transparent}
.radar.main{cursor:zoom-in}
.radar.main.dragging{cursor:grabbing}
.rd-node.off .rd-dot{fill:#0F172A;stroke:var(--dim);stroke-width:1.5;stroke-dasharray:2 2}
.rmodal .radar-card .example{margin-top:6px}
.typeseg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.typeseg button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:7px;border:1px solid #334155;background:#0F172A}
.typeseg button .ic{width:20px;height:20px;color:var(--muted)}
.typeseg button b{display:block;font-size:13px;font-weight:500}
.typeseg button small{display:block;font-size:11.5px;color:var(--muted)}
.typeseg button:hover{border-color:var(--line-2)}
.typeseg button.on{border-color:var(--accent);background:var(--accent-soft)}
.typeseg button.on .ic{color:#b6bbff}
.rmodal.add .form{gap:10px;grid-template-columns:1fr 1fr}
.rmodal.add .form label{font-size:11.5px;gap:4px}
.rmodal.add .field{height:32px}
.rmodal.add .form .field{width:100%}
.rmodal.add .valrow{display:flex;align-items:center;gap:6px}
.rmodal.add .valrow .field{width:100%}
.rmodal.add .stepper input{width:44px}
.rmodal.add .stepper button{height:30px;width:30px}
.rmodal.add .stepper input{height:30px}
.preview{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:6px;background:#0F172A;border:1px solid #334155;font-size:12.5px;color:#cfd3ff}
.preview .ic{width:15px;height:15px;margin-top:1px;color:#b6bbff}
.zgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:center}
.zgrid .radar{max-width:560px;margin:0 auto;width:100%}
.zlist{display:flex;flex-direction:column}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #334155;font-size:12.5px}
.zrow.off{opacity:.45}
.zrow .zl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow .stepper b{width:26px;text-align:center;font-size:12.5px}
.zrow .stepper button{width:24px;height:24px;font-size:14px}
.zrow .pct{min-width:0;font-size:12px}
.rmodal.zoom .rd-lbl{font-size:13px}
@media (max-width:760px){.zgrid{grid-template-columns:1fr}.rmodal.add .form{grid-template-columns:1fr}}

/* ---- rules modal v4: accordions ---- */

.acc{border:1px solid #334155;border-radius:8px;background:#172235}

.acc-t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rtag.warnb{color:var(--warn);border-color:rgba(246,185,75,.4)}

.rmodal .radar-card{position:static}
.rd-center{fill:#0F172A;stroke:#334155}

@media (max-width:760px){.acc-h{flex-wrap:wrap}.acc-badges{width:100%;justify-content:flex-start;padding-left:26px}.acc-t small{white-space:normal}}

/* ---- rules modal v5: header add buttons ---- */
.acc-h{cursor:pointer;padding:0;gap:0}

.rmodal,.rmodal *{box-sizing:border-box}

.rd-csub{font-size:8.5px;fill:var(--muted)}

/* ---- 100-point budget: total row ---- */

.ftotal .ft-l{min-width:0}

.ftotal .ft-l small.okc{color:var(--ok)}
.ftotal .ft-pts{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}

.ftotal .pct{text-align:right;min-width:0}
.ftotal .ft-bar{grid-column:1/-1;height:5px;border-radius:3px;background:#0F172A;overflow:hidden}
.ftotal .ft-bar span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .15s}
.ftotal.z{padding-top:8px;grid-template-columns:minmax(0,1fr) auto 44px}
.rmodal.add label small{font-size:11px;color:var(--muted)}

.stepper button:disabled{cursor:not-allowed}
.rmodal.zoom .zrow{padding:4px 0}

/* ---- guard list: tiers, full-row selection ---- */

.tier-h{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:11.5px;color:var(--muted)}

.tbadge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:4px;padding:2px 7px;white-space:nowrap}
.tbadge.t-high{background:rgba(60,207,145,.16);color:#5fe0a8;box-shadow:inset 0 0 0 1px rgba(60,207,145,.35)}
.tbadge.t-rec{background:rgba(90,169,255,.16);color:#8cc3ff;box-shadow:inset 0 0 0 1px rgba(90,169,255,.35)}
.tbadge.t-low{background:rgba(246,185,75,.15);color:#f8c76a;box-shadow:inset 0 0 0 1px rgba(246,185,75,.35)}
.tbadge.t-attn{background:rgba(242,103,122,.15);color:#f68b9a;box-shadow:inset 0 0 0 1px rgba(242,103,122,.35)}
.opt .tline{display:block;margin:3px 0 2px}
.aipick{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#ffd36b}

.opt{transition:border-color .15s, background-color .15s, opacity .15s, box-shadow .15s}

.opt.focus.dis .viewing{color:var(--bad)}

.why-head .tbadge{align-self:center}
.selstate{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 10px;border-radius:6px;margin:-4px 0 12px;background:var(--panel-2);color:var(--muted)}
.selstate .ic{width:15px;height:15px}
.selstate.ok{background:var(--ok-soft);color:var(--ok)}
.selstate.bad{background:var(--bad-soft);color:var(--bad)}

/* ---- All Open/Vacant: interactive filter cards + shift review ---- */

.listbar{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

.drawer-scrim.rv{z-index:75}

/* ---- Edit Shift: AI guard recommendations ---- */
.modal.edit{width:min(720px,100%)}
.tbadge.t-ai{background:rgba(111,120,255,.18);color:#c3c7ff;box-shadow:inset 0 0 0 1px rgba(111,120,255,.45)}
.selwrap{position:relative;display:block}

function activeFactors(rules){ return rules.factors.filter(f=>f.on && f.weight>0); }
function factorPct(rules, key){ const act=activeFactors(rules); const tot=act.reduce((t,f)=>t+f.weight,0); const f=act.find(x=>x.key===key); return f&&tot? f.weight/tot*100 : 0; }

/* ===================== ENGINE ===================== */
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function range(sh){ const b=parseDate(sh.date); const s=b+toMin(sh.start)*60000; let e=b+toMin(sh.end)*60000; if(e<=s) e+=DAY; return [s,e]; }
function shHours(sh){ const [s,e]=range(sh); return (e-s)/3600000; }
function shiftType(sh){ const h=toMin(sh.start)/60; if(h>=4 && h<14) return 'Day'; if(h>=14 && h<20) return 'Evening'; return 'Overnight'; }
function weekOf(ms){ const day=ms-(ms%DAY); const dw=(new Date(day).getUTCDay()+6)%7; return day-dw*DAY; }
function r1(n){ return Math.round(n*10)/10; }
function guardById(id){ return GUARDS.find(g=>g.id===id); }
function shiftById(id){ return SHIFTS.find(s=>s.id===id); }
function hasQual(g,q){ return g.quals.includes(q) || (q==='Unarmed Guard' && g.quals.includes('Armed Guard')); }
function distTo(g, siteId){ const s=SITES[siteId]; return r1(Math.hypot(g.hx-s.x, g.hy-s.y)); }
function siteDist(a,b){ const A=SITES[a],B=SITES[b]; return r1(Math.hypot(A.x-B.x, A.y-B.y)); }
const DOWN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(ds){ const d=new Date(parseDate(ds)); return MON[d.getUTCMonth()]+' '+d.getUTCDate(); }
function fmtDay(ds){ const d=new Date(parseDate(ds)); return DOWN[d.getUTCDay()].slice(0,3)+', '+MON[d.getUTCMonth()]+' '+d.getUTCDate(); }

/* Base assignment list = every assigned shift currently on the schedule */
function baseAssignments(excludeIds){
  const ex = new Set(excludeIds||[]);
  return SHIFTS.filter(s=>s.status==='assigned' && s.guardId && !ex.has(s.id)).map(s=>({shift:s, guardId:s.guardId, source:'schedule'}));
}

function weekHours(g, wk, list, excludeId){
  let h = g.extraHours;
  list.forEach(a=>{ if(a.guardId===g.id && a.shift.id!==excludeId && weekOf(range(a.shift)[0])===wk) h+=shHours(a.shift); });
  return h;
}

function hm(min){ min=Math.max(0,Math.round(min)); const h=Math.floor(min/60), m=min%60; return h? (h+'h'+(m? ' '+m+'m':'')) : m+'m'; }
function fmtT(ms){ const d=new Date(ms); return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'); }
function shLabel(o){ return fmtShort(o.date)+' '+o.start+'–'+o.end+' at '+SITES[o.site].name; }
function travelMin(a,b){ return a===b ? 0 : Math.round(siteDist(a,b)/30*60); }   // 30 mph average urban speed
function availCovers(g, sh){
  if(g.availFrom==='00:00' && g.availTo==='24:00') return true;
  const [s,e]=range(sh), f=toMin(g.availFrom), t=toMin(g.availTo);
  for(const off of [-1,0]){ const b=parseDate(sh.date)+off*DAY; const ws=b+f*60000; let we=b+t*60000; if(we<=ws) we+=DAY; if(ws<=s && e<=we) return true; }
  return false;
}

function evaluate(g, sh, list, rules){
  const H = rules.hard;
  const site = SITES[sh.site];
  const st = shiftType(sh);
  const [s,e] = range(sh);
  const w = dow(sh.date);
  const checks = [];
  const add = (key,label,pass,detail,blockLabel,extra)=>checks.push(Object.assign({key,label,pass,detail,on:!!H[key],blockLabel},extra||{}));

  // 1. Active
  add('active','Guard must be Active', g.status==='Active', g.status==='Active'?'Active':'Inactive — '+(g.statusNote||'not active'), 'Guard inactive');

  // 2. Availability for the COMPLETE shift
  const code = g.avail[w];
  let avPass=true, avDetail;
  if(g.timeOff.includes(sh.date)){ avPass=false; avDetail='Approved time off on '+fmtShort(sh.date); }
  else if(code==='-'){ avPass=false; avDetail='Not available on '+DOWN[w]+'s'; }
  else if(!availCovers(g, sh)){ avPass=false; avDetail='Available '+g.availFrom+'–'+g.availTo+' only; cannot cover the full shift '+sh.start+'–'+sh.end; }
  else avDetail = (code==='C' ? 'On-call ' : 'Available ')+(g.availFrom==='00:00'&&g.availTo==='24:00'?'all day':g.availFrom+'–'+g.availTo)+' on '+DOWN[w]+'s; covers '+sh.start+'–'+sh.end;
  add('available','Available for Full Shift', avPass, avDetail, 'Unavailable for full shift');

  // 3. Qualifications / certifications (held AND valid on the shift date)
  const missing = sh.req.filter(q=>!certKey(g,q));
  const expired = sh.req.filter(q=>certKey(g,q) && !certValidOn(g,q,sh.date));
  let qDetail;
  if(missing.length) qDetail='Missing '+missing.join(', ');
  else if(expired.length) qDetail=expired.map(q=>certKey(g,q)+' certification expired '+fmtLongDate(g.certExp[certKey(g,q)])).join('; ');
  else qDetail='Holds valid '+sh.req.join(', ');
  add('qualification','Required Qualification / Certification', !missing.length && !expired.length, qDetail, expired.length&&!missing.length?'Certification expired':'Qualification mismatch');

  // 4. Required skills
  const rSk = reqSkills(sh), missR = rSk.filter(k=>!g.skills.includes(k));
  add('skills','Required Skills / Training', !missR.length, !rSk.length?'No mandatory skills for this post':missR.length?'Missing required skill: '+missR.join(', '):'Has '+rSk.join(', '), 'Missing required skill');

  // 5. Department (required vs preferred)
  const mode = deptMode(sh), deptHome = g.dept===sh.dept, deptCross = g.cross.includes(sh.dept);
  const deptOk = mode==='preferred' || deptHome || deptCross;
  add('department','Required Department', deptOk,
    deptHome ? sh.dept+' ('+mode+')' : deptCross ? 'Cross-trained for '+sh.dept+' ('+mode+')' : mode==='preferred' ? g.dept+'; '+sh.dept+' is preferred, not required' : g.dept+' — post requires '+sh.dept, 'Department mismatch');

  // 6-8. Whole-schedule checks: overlap, travel feasibility, rest
  const mine = list.filter(a=>a.guardId===g.id && a.shift.id!==sh.id).map(a=>({a, r:range(a.shift)}));
  const overlap = mine.find(x=>x.r[0]<e && x.r[1]>s);
  let prev=null, next=null;
  mine.forEach(x=>{ if(x.r[1]<=s && (!prev || x.r[1]>prev.r[1])) prev=x; if(x.r[0]>=e && (!next || x.r[0]<next.r[0])) next=x; });
  const tag = x => x.a.source==='batch' ? ' (recommended in this run)' : '';
  add('conflict','No Overlapping Shift', !overlap, overlap ? 'Already working '+shLabel(overlap.a.shift)+tag(overlap) : 'No overlapping shift', 'Overlapping shift', overlap?{withId:overlap.a.shift.id}:{});

  const buf = rules.travelBuffer||0, near = 24*60;
  const leg = (x, dir) => { if(!x) return null; const gap = dir<0 ? (s-x.r[1])/60000 : (x.r[0]-e)/60000;
    const from = dir<0 ? x.a.shift.site : sh.site, to = dir<0 ? sh.site : x.a.shift.site;
    const tm = travelMin(from,to), need = tm + (from!==to?buf:0); return {x, dir, gap, tm, need, rest: gap - tm, from, to}; };
  const P = leg(prev,-1), N = leg(next,1);
  const badT = [P,N].find(L=>L && L.gap < L.need);
  let tDetail;
  if(badT){
    tDetail = badT.dir<0 ? 'Previous shift at '+SITES[badT.from].name+' ends '+fmtT(badT.x.r[1])+'; '+badT.tm+' min travel + '+buf+' min buffer needed, but this shift starts '+sh.start+' at '+site.name+tag(badT.x)
                         : 'Next shift at '+SITES[badT.to].name+' starts '+badT.x.a.shift.start+'; '+badT.tm+' min travel + '+buf+' min buffer needed after this shift ends '+sh.end+tag(badT.x);
  } else {
    const legs=[P,N].filter(L=>L && L.gap<near && L.from!==L.to);
    tDetail = legs.length ? legs.map(L=>L.dir<0 ? 'From '+SITES[L.from].name+' (ends '+fmtT(L.x.r[1])+'): '+L.tm+' min travel, arrives with '+hm(L.gap-L.tm)+' to spare' : 'To '+SITES[L.to].name+' next ('+L.x.a.shift.start+'): '+L.tm+' min travel fits').join('; ')
      : ([P,N].some(L=>L && L.gap<near) ? 'Adjacent shift is at the same site' : 'No adjacent shift within 24h');
  }
  add('travel','Travel Feasibility', !badT, tDetail, 'Cannot reach site in time', badT?{withId:badT.x.a.shift.id}:{});

  const restMinReq = (rules.restHours||0)*60;
  const legsR = [P,N].filter(L=>L && L.gap>=L.need);
  const badR = legsR.find(L=>L.rest < restMinReq);
  const minRestLeg = legsR.filter(L=>L.gap<near*2).sort((a,b)=>a.rest-b.rest)[0];
  let rDetail;
  if(badR) rDetail = 'Only '+hm(badR.rest)+' rest'+(badR.dir<0?' after ':' before ')+shLabel(badR.x.a.shift)+(badR.tm?' (after '+badR.tm+' min travel)':'')+'; minimum is '+rules.restHours+'h'+tag(badR.x);
  else rDetail = minRestLeg ? hm(minRestLeg.rest)+' rest '+(minRestLeg.dir<0?'after previous':'before next')+' shift (minimum '+rules.restHours+'h)' : 'No adjacent shift within 48h';
  add('rest','Minimum Rest Between Shifts', !badR, rDetail, 'Insufficient rest', badR?{withId:badR.x.a.shift.id}:{});

  // 9. Site / post clearance
  const siteOk = !site.restricted || g.cleared.includes(sh.site);
  add('site','Site/Post Eligibility', siteOk, siteOk ? (site.restricted?'Cleared for '+site.name:'No site clearance needed') : 'Not cleared for '+site.name, 'Not cleared for site');

  // 10-11. Hours and overtime (whole week: worked + already scheduled + this shift)
  const wk = weekOf(s);
  const before = weekHours(g, wk, list, sh.id);
  const shiftH = shHours(sh);
  const projected = before + shiftH;
  const ot = g.otAt, otH = Math.max(0, projected - Math.max(ot, before)), otTotal = Math.max(0, projected-ot);
  add('maxHours','Maximum Weekly Hours', projected<=rules.maxHoursCap, before+'h this week + '+shiftH+'h = '+projected+'h (limit '+rules.maxHoursCap+'h)', 'Weekly hour limit exceeded');
  const otAllowed = rules.overtimePolicy!=='notallowed';
  add('overtime','Overtime Policy', otAllowed || otTotal===0,
    otTotal ? otTotal+'h overtime ('+projected+'h vs '+ot+'h threshold) — '+(otAllowed?'allowed, ranked lower':'overtime is not allowed') : 'No overtime ('+projected+'h of '+ot+'h)', 'Overtime not allowed');

  (rules.customHard||[]).forEach(c=>{
    if(c.site!=='all' && c.site!==sh.site) return;
    const T = HARD_TEMPLATES[c.cond]; if(!T) return;
    checks.push({key:c.key, label:c.label, pass:T.test(g,sh,c.value), detail:T.detail(g,sh,c.value), on:!!c.on, blockLabel:c.label, custom:true});
  });
  const eligible = checks.every(c=>!c.on || c.pass);
  const blocking = checks.filter(c=>c.on && !c.pass);

  // ---- factor scores (ranking only; never override a hard rule) ----
  const d = distTo(g, sh.site);
  const f = {}, det = {};
  f.availability = !avPass ? 0 : code==='C' ? 70 : 100;
  det.availability = avDetail;
  const okReq = sh.req.filter(q=>certValidOn(g,q,sh.date)).length;
  const prefMet = sh.pref.filter(q=>certValidOn(g,q,sh.date)).length;
  if(okReq<sh.req.length) f.qualification = Math.round(70*okReq/sh.req.length);
  else if(sh.pref.length) f.qualification = 70 + Math.round(30*prefMet/sh.pref.length);
  else f.qualification = 100;
  det.qualification = okReq<sh.req.length ? qDetail : (sh.pref.length ? (prefMet? 'Required + preferred ('+sh.pref.join(', ')+')' : 'Required only; lacks preferred '+sh.pref.join(', ')) : 'All required certifications valid');
  f.department = deptHome?100 : deptCross?75 : mode==='preferred'?40 : 0;
  det.department = deptHome?'Home department' : deptCross?'Cross-trained' : 'Other department ('+g.dept+')';
  f.travel = Math.max(0, Math.min(100, Math.round(100 - Math.max(0,d-2)*4)));
  det.travel = d+' mi from '+g.home;
  const n = g.siteHist[sh.site]||0, postW = g.postHist.includes(sh.site+'|'+sh.post);
  f.continuity = Math.min(100, 30 + n*5 + (postW?15:0));
  det.continuity = n ? n+' shifts at site'+(postW?', incl. this post':'') : 'New to this site';
  const avoid = g.avoidSites.includes(sh.site), prefSite = g.prefSites.includes(sh.site);
  f.guardPref = prefSite?100 : avoid?20 : 60;
  det.guardPref = prefSite?'Preferred site' : avoid?'Asked not to work here':'No stated preference';
  f.overtime = projected <= ot-8 ? 100 : projected <= ot ? Math.round(100 - (projected-(ot-8))*2.5) : Math.max(0, Math.round(80 - otTotal*8));
  det.overtime = otTotal ? otTotal+'h overtime ('+projected+'h vs '+ot+'h)' : projected+'h of '+ot+'h before overtime';
  f.shiftPref = g.prefShifts[0]===st ? 100 : g.prefShifts.includes(st) ? 80 : 45;
  det.shiftPref = g.prefShifts.includes(st) ? 'Prefers '+g.prefShifts.join(' / ') : 'Prefers '+g.prefShifts.join(' / ')+', not '+st;
  f.history = Math.round((g.att+g.onTime)/2);
  det.history = g.att+'% attendance, '+g.onTime+'% on time';
  const needSk = shiftSkills(sh), missSk = needSk.filter(k=>!g.skills.includes(k));
  f.skills = needSk.length ? Math.round(100*(needSk.length-missSk.length)/needSk.length) : 100;
  det.skills = !needSk.length ? 'No preferred skills listed' : missSk.length ? 'Missing preferred '+missSk.join(', ') : 'Holds '+needSk.join(', ');
  rules.factors.filter(x=>x.custom).forEach(x=>{ const src=CUSTOM_SOURCES[x.source]; f[x.key]=src?src.fn(g):0; det[x.key]=src?src.det(g):'No data source'; });

  const active = activeFactors(rules);
  const wsum = active.reduce((t,x)=>t+x.weight,0);
  const sum = active.reduce((t,x)=>t+(f[x.key]||0)*x.weight,0);
  const raw = wsum ? sum/wsum : 0;
  const score = Math.round(raw);

  // ---- warnings (eligible but needs attention; never blocking) ----
  const warnings = [];
  if(otTotal>0 && otAllowed) warnings.push({type:'Overtime', text:'Overtime: '+otTotal+'h over the '+ot+'h threshold ('+projected+'h projected) · est. $'+Math.round(otTotal*g.rate*1.5)+' at 1.5×'});
  else if(projected >= ot-4) warnings.push({type:'High weekly hours', text:'High weekly hours: '+projected+'h projected (overtime after '+ot+'h)'});
  if(minRestLeg && !badR && minRestLeg.rest < (rules.restWarn||0)*60) warnings.push({type:'Short rest', text:'Short rest: '+hm(minRestLeg.rest)+(minRestLeg.dir<0?' after ':' before ')+shLabel(minRestLeg.x.a.shift)});
  if(d > rules.travelWarn) warnings.push({type:'Long commute', text:'Long commute: '+d+' mi from home'});
  if(!g.prefShifts.includes(st)) warnings.push({type:'Preference mismatch', text:'Preference mismatch: prefers '+g.prefShifts.join(' / ')+' shifts'});
  if(avoid) warnings.push({type:'Preference mismatch', text:'Preference mismatch: asked not to work at '+site.name});
  if(missSk.length) warnings.push({type:'Skills gap', text:'Preferred skills missing: '+missSk.join(', ')});
  if(mode==='preferred' && !deptHome && !deptCross) warnings.push({type:'Department', text:'Outside preferred department ('+g.dept+')'});
  sh.req.forEach(q=>{ const k=certKey(g,q); const x=k&&g.certExp[k]; if(x && x>=sh.date && (parseDate(x)-parseDate(sh.date))/DAY<=30) warnings.push({type:'Certification', text:k+' certification expires '+fmtLongDate(x)}); });
  if(code==='C' && avPass) warnings.push({type:'On-call', text:'On-call only on '+DOWN[w]+'s — confirm with guard'});

  const MAJOR = ['Overtime','High weekly hours','Short rest','Certification','On-call'];
  warnings.forEach(x=>{ x.major = MAJOR.includes(x.type); });
  // ---- reasons ----
  const reasons = [];
  if(avPass) reasons.push(code==='C'?'Available (on-call) for the full shift':'Available for the full shift');
  if(okReq===sh.req.length) reasons.push('Valid '+sh.req.join(' + ')+(prefMet?' + preferred cert':''));
  if(rSk.length && !missR.length) reasons.push('Has required skill'+(rSk.length>1?'s':'')+' ('+rSk.join(', ')+')');
  if(deptHome) reasons.push('Home department'); else if(deptCross) reasons.push('Cross-trained for department');
  if(!overlap && !badT && !badR) reasons.push(minRestLeg ? 'Enough rest ('+hm(minRestLeg.rest)+') and travel is feasible' : 'No other shift within 48h');
  if(d<=6) reasons.push('Close to site ('+d+' mi)');
  if(n) reasons.push('Worked at this site before ('+n+' shifts)');
  if(g.prefShifts.includes(st)) reasons.push('Preferred shift ('+st+')');
  if(prefSite) reasons.push('Preferred site');
  if(otTotal===0) reasons.push('No overtime ('+projected+'h of '+ot+'h)');

  const ctx = { prev:P, next:N, weekShifts: mine.filter(x=>weekOf(x.r[0])===wk).map(x=>x.a) };
  return { guard:g, shift:sh, eligible, checks, blocking, factors:f, details:det, activeFactors:active.map(x=>({key:x.key,label:x.label,weight:x.weight,value:f[x.key]||0})), wsum, sum, raw, score, warnings, reasons,
    projected, before, shiftH, otAt:ot, otH:otTotal, distance:d, shiftType:st, ctx };
}

function rank(evals){ return evals.slice().sort((a,b)=> b.score-a.score || b.guard.rating-a.guard.rating || a.distance-b.distance); }

function explainClauses(ev){
  const g=ev.guard, c=[];
  c.push(ev.factors.availability===100?'are available':'are available on call');
  c.push(ev.factors.qualification===100?'are fully qualified':'meet the required qualifications');
  if(!ev.blocking.length) c.push('have no scheduling conflict');
  if(g.siteHist[ev.shift.site]) c.push('have worked '+g.siteHist[ev.shift.site]+' shifts at this site');
  if(ev.distance<=6) c.push('live '+ev.distance+' miles away');
  if(ev.factors.shiftPref===100) c.push('prefer '+ev.shiftType.toLowerCase()+' shifts');
  return c;
}
function joinList(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+', and '+a[a.length-1]; }
function explain(ev, lead){
  let s = (lead || ev.guard.name+' is recommended because they')+' '+joinList(explainClauses(ev))+'.';
  if(ev.warnings.length) s += ' Review '+ev.warnings.length+' warning'+(ev.warnings.length>1?'s':'')+' before applying.';
  return s;
}

/* Whole-schedule optimisation for a batch of open/vacant shifts.
   Objective: (1) fill as many shifts as possible with valid assignments, (2) maximise total score.
   Every candidate is evaluated against the full schedule PLUS the other recommendations in the run,
   so the same guard is never recommended for two shifts they cannot both work. */
function runBatch(shiftIds, rules, locks){
  locks = locks || {};
  const shifts = shiftIds.map(shiftById).filter(Boolean);
  const ids0 = shifts.map(s=>s.id);
  const base = baseAssignments(ids0);
  const indep = {};
  shifts.forEach(sh=>{ indep[sh.id] = rank(GUARDS.map(g=>evaluate(g,sh,base,rules)).filter(e=>e.eligible)); });
  const ids = shifts.slice().sort((a,b)=> indep[a.id].length-indep[b.id].length || range(a)[0]-range(b)[0]).map(s=>s.id);
  const ctx = (pick, sid) => base.concat(Object.entries(pick).filter(([k,v])=>k!==sid && v).map(([k,v])=>({shift:shiftById(k), guardId:v, source:'batch'})));
  const cands = (pick, sid) => rank(GUARDS.map(g=>evaluate(g,shiftById(sid),ctx(pick,sid),rules)).filter(e=>e.eligible));
  const valid = (pick, sid) => !pick[sid] || evaluate(guardById(pick[sid]),shiftById(sid),ctx(pick,sid),rules).eligible;
  const objective = pick => { let filled=0, sum=0; for(const sid of ids){ const gid=pick[sid]; if(!gid) continue; const ev=evaluate(guardById(gid),shiftById(sid),ctx(pick,sid),rules); if(!ev.eligible) return -1; filled++; sum+=ev.score; } return filled*1000+sum; };
  let pick = {};
  const dropped = [];
  Object.entries(locks).forEach(([sid,gid])=>{ if(ids.includes(sid)) pick[sid]=gid||null; });
  Object.keys(locks).forEach(sid=>{ if(pick[sid] && !valid(pick,sid)){ dropped.push({sid, gid:pick[sid]}); delete pick[sid]; } });
  const locked = sid => (sid in locks) && !dropped.find(d=>d.sid===sid);
  for(const sid of ids){ if(locked(sid)) continue; const c=cands(pick,sid); pick[sid]=c.length?c[0].guard.id:null; }
  let best = objective(pick);
  for(let pass=0; pass<5; pass++){
    let improved=false;
    for(const sid of ids){
      if(locked(sid)) continue;
      for(const e of indep[sid].slice(0,8)){
        if(e.guard.id===pick[sid]) continue;
        const trial = {...pick, [sid]:e.guard.id};
        for(const t of ids){ if(t===sid || locked(t) || !trial[t]) continue; if(!valid(trial,t)){ const c=cands(trial,t); trial[t]=c.length?c[0].guard.id:null; } }
        for(const t of ids){ if(t===sid || locked(t) || trial[t]) continue; const c=cands(trial,t); if(c.length) trial[t]=c[0].guard.id; }
        const sc = objective(trial);
        if(sc > best){ best=sc; pick=trial; improved=true; }
      }
    }
    if(!improved) break;
  }
  const notes = {};
  for(const sid of ids){
    const top = indep[sid][0]; if(!top) continue;
    const sh = shiftById(sid);
    if(!pick[sid]){
      const users = indep[sid].map(e=>Object.keys(pick).find(k=>pick[k]===e.guard.id)).filter(Boolean);
      notes[sid] = { kind:'starved', top: top.guard.id, users:[...new Set(users)] }; continue;
    }
    if(top.guard.id === pick[sid]) continue;
    const re = evaluate(top.guard, sh, ctx(pick,sid), rules);
    const where = Object.keys(pick).find(k=>pick[k]===top.guard.id && k!==sid);
    const why = re.blocking[0];
    let reason;
    if(why) reason = why.blockLabel.toLowerCase()+': '+why.detail;
    else if(where){
      const trial = {...pick, [sid]:top.guard.id, [where]:null};
      for(const t of ids){ if(t===sid || locked(t)) continue; if(trial[t] && !valid(trial,t)){ const c=cands(trial,t); trial[t]=c.length?c[0].guard.id:null; } if(!trial[t]){ const c=cands(trial,t); if(c.length) trial[t]=c[0].guard.id; } }
      const fill = p => ids.filter(t=>p[t]).length, tot = objective(trial);
      const lost = fill(pick)-fill(trial);
      reason = 'is recommended for '+shLabel(shiftById(where))+' instead; '+(lost>0 ? 'moving them here would leave '+lost+' shift'+(lost>1?'s':'')+' without a valid guard' : (tot<0 ? 'moving them here would create a conflict elsewhere in this run' : 'moving them here lowers the combined score of this run by '+Math.max(1,Math.round((best-fill(pick)*1000)-(tot-fill(trial)*1000)))+' point'+(Math.round((best-fill(pick)*1000)-(tot-fill(trial)*1000))===1?'':'s')+' (overtime or weaker matches elsewhere)'));
    }
    else reason = 'scores lower ('+re.score+'%) once hours from other recommendations in this run are counted';
    notes[sid] = { top: top.guard.id, topScore: top.score, chosen: pick[sid], other: (why&&why.withId)||where, reason };
  }
  return { shiftIds: ids0.slice(), ai: pick, notes, locks: {...locks}, dropped, ranAt: Date.now() };
}

/* Re-validate selections against the CURRENT schedule (used before Apply). */
function validateSelections(shiftIds, selection, rules){
  const base = baseAssignments(shiftIds);
  const issues = [];
  shiftIds.forEach(sid=>{
    const gid = selection[sid]; if(!gid) return;
    const sh = shiftById(sid);
    if(!sh){ issues.push({sid, gid, label:'Shift was deleted', detail:'The shift no longer exists.'}); return; }
    if(sh.status==='assigned' && sh.guardId){ issues.push({sid, gid, label:'Shift already filled', detail:'Now assigned to '+guardById(sh.guardId).name+'.'}); return; }
    const others = Object.entries(selection).filter(([k,v])=>k!==sid && v).map(([k,v])=>({shift:shiftById(k), guardId:v, source:'batch'}));
    const ev = evaluate(guardById(gid), sh, base.concat(others), rules);
    if(!ev.eligible) issues.push({sid, gid, label:ev.blocking[0].blockLabel, detail:ev.blocking[0].detail, ev});
  });
  return issues;
}
/* Re-validate unpublished assignments before Publish. */
function validateAssignments(ids, rules){
  const issues=[];
  ids.forEach(id=>{ const sh=shiftById(id); if(!sh || !sh.guardId) return;
    const ev=evaluate(guardById(sh.guardId), sh, baseAssignments([sh.id]), rules);
    if(!ev.eligible) issues.push({sid:id, gid:sh.guardId, label:ev.blocking[0].blockLabel, detail:ev.blocking[0].detail, ev}); });
  return issues;
}

/* Live evaluation of one result row given other rows' current selections */
function rowEval(run, sid, rules, selection){
  const sh = shiftById(sid);
  const base = baseAssignments(run.shiftIds);
  const others = Object.entries(selection).filter(([k,v])=>k!==sid && v).map(([k,v])=>({shift:shiftById(k), guardId:v, source:'batch'}));
  const live = base.concat(others);
  const all = GUARDS.map(g=>({ base: evaluate(g,sh,base,rules), live: evaluate(g,sh,live,rules) }));
  const eligible = rank(all.filter(x=>x.base.eligible).map(x=>x.live)).map(ev=>({ ev, blockedLive: !ev.eligible }));
  // keep live-eligible first by score, blocked after
  eligible.sort((a,b)=> (a.blockedLive-b.blockedLive) || b.ev.score-a.ev.score);
  const excluded = all.filter(x=>!x.base.eligible).map(x=>x.base);
  return { sh, eligible, excluded };
}

function noEligibleSummary(excluded){
  const counts = {};
  excluded.forEach(ev=>ev.blocking.forEach(c=>{ counts[c.blockLabel]=(counts[c.blockLabel]||0)+1; }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}

if(typeof module!=='undefined') module.exports = { validateSelections, validateAssignments, reqSkills, deptMode, HARD_TEMPLATES, activeFactors, CUSTOM_SOURCES, SHIFTS, GUARDS, SITES, FACTORS, defaultRules, runBatch, rowEval, evaluate, baseAssignments, shiftById, explain, noEligibleSummary };

</script>

/* ---------- helpers ---------- */
function initials(n){ return n.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }
const AVC = ['#9fd8ff','#ffd29a','#b9f0c9','#f7b9d6','#c8c3ff','#ffe39b','#a7ecec','#f5c1a8'];
function avatar(g){ const i = parseInt(g.id.slice(2),10)%AVC.length; return `<span class="av" style="background:${AVC[i]}">${esc(initials(g.name))}</span>`; }
function scoreCls(v){ return v>=85?'hi':v>=70?'mid':v>0?'lo':'zero'; }
function scoreBar(v){ return `<div class="score"><b>${v}%</b><div class="bar"><span class="${scoreCls(v)}" style="width:${v}%"></span></div></div>`; }
function timeRange(s){ return s.start+' - '+s.end; }
function monthName(ds){ const d=new Date(parseDate(ds)); return MONTHS[d.getUTCMonth()]+', '+d.getUTCFullYear(); }
function longDay(ds){ const d=new Date(parseDate(ds)); return DOWN[d.getUTCDay()]+', '+MON[d.getUTCMonth()]+' '+d.getUTCDate(); }
function visible(s){
  if(!S.filters.sites.has(s.site)) return false;
  if(!S.filters.status.has(s.status)) return false;
  if(s.status==='assigned' && !S.filters.pub.has(s.published?'published':'unpublished')) return false;
  if(S.aiOnly && !s.ai) return false;
  return true;
}
function isOpen(s){ return s.status==='open' || s.status==='vacant'; }
function byStart(a,b){ return toMin(a.start)-toMin(b.start); }
function monthGrid(){
  const [y,m] = S.focus.split('-').map(Number);
  const first = `${y}-${pad(m)}-01`, last = isoDate(Date.UTC(y,m,0));
  let d = addDays(first, -((dow(first)-2+7)%7));
  const days=[];
  while(d<=last || days.length%7){ days.push(d); d=addDays(d,1); }
  return {days, first, last};
}
function weekDays(){ let d=addDays(S.focus, -((dow(S.focus)-2+7)%7)); const a=[]; for(let i=0;i<7;i++){a.push(d); d=addDays(d,1);} return a; }
function viewRange(){
  if(S.view==='month'){ const g=monthGrid(); return [g.days[0], g.days[g.days.length-1]]; }
  if(S.view==='week'){ const w=weekDays(); return [w[0],w[6]]; }
  if(S.view==='day') return [S.focus,S.focus];
  const g=monthGrid(); return [g.first,g.last];
}
function shiftsInView(){ const [a,b]=viewRange(); return SHIFTS.filter(s=>s.date>=a && s.date<=b && visible(s)); }
function rangeLabel(){
  if(S.view==='month' || S.view==='list') return monthName(S.focus);
  if(S.view==='week'){ const w=weekDays(); return fmtShort(w[0])+' – '+fmtShort(w[6])+', 2026'; }
  return longDay(S.focus);
}
function toast(msg, icon='check'){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=ic(icon)+'<span>'+esc(msg)+'</span>';

}

function cardHTML(s, variant){

  if(s.status==='open') cls+=' open'; else if(s.status==='vacant') cls+=' vacant';
  else { cls+=' s-'+site.color; if(!s.published) cls+=' unpub'; }
  if(S.mode==='ai-select') cls += isOpen(s) ? ' selectable' : ' locked';
  if(S.mode==='multi') cls += ' selectable';
  if(S.selected.has(s.id)) cls+=' selected';
  if(S.flash.has(s.id)) cls+=' flash';
  if(s.confirmed) cls+=' confirmed';
  const who = g ? g.name : (s.status==='open'?'No Guard':'Vacant');
  const tags = [];
  if(s.status==='assigned' && !s.published) tags.push('<span class="tag unpub">Unpublished</span>');
  if(s.ai && s.status==='assigned' && !s.published) tags.push('<span class="tag ai">AI</span>');
  const sub = variant==='wide' ? `<span class="sub">${esc(site.name)} · ${esc(s.post)}</span>` : '';
  const right = S.mode ? `<span class="pick"><i></i></span>` : `<button class="kebab" data-act="shiftmenu" data-id="${s.id}" aria-label="Shift actions">${ic('kebab','fill')}</button>`;

/* ---------- results ---------- */
function selectedFor(sid){ return S.sel[sid] || null; }
function rowData(sid){ return rowEval(S.run, sid, S.rules, S.sel); }
function rowStatus(sid, rd){
  const gid = selectedFor(sid);
  if(!rd.eligible.length) return {key:'none', html:`<span class="st warn">${ic('alert')}No Eligible Guard</span>`};
  if(!gid) return S.manual[sid]==='skip' ? {key:'skip', html:`<span class="st muted">Left open</span>`} : {key:'unres', html:`<span class="st warn">${ic('alert')}Unresolved</span>`};
  const x = rd.eligible.find(y=>y.ev.guard.id===gid);
  if(!x || x.blockedLive) return {key:'invalid', html:`<span class="st bad">${ic('xcirc')}Needs review</span>`};
  const m = majorWarn(x.ev).length;
  return m ? {key:'warn', html:`<span class="st warn">${ic('alert')}Ready · ${m} warning${m>1?'s':''}</span>`} : {key:'ready', html:`<span class="st ok">${ic('check')}Ready</span>`};
}
function resultStats(){
  let ready=0, unres=0, sum=0, hi=0, review=0, manual=0, cnt=0, invalid=0;
  S.run.shiftIds.forEach(sid=>{
    const rd=rowData(sid), gid=selectedFor(sid);
    if(!gid){ unres++; return; }
    const found=rd.eligible.find(x=>x.ev.guard.id===gid);
    if(!found || found.blockedLive){ invalid++; return; }
    const ev=found.ev;
    ready++; sum+=ev.score; cnt++;
    if(majorWarn(ev).length) review++; else hi++;
    if(gid!==S.run.ai[sid]) manual++;
  });
  return {total:S.run.shiftIds.length, ready, unres, invalid, avg: cnt?Math.round(sum/cnt):0, hi, review, manual};
}

        <td>${gcell}${gid&&!ev?`<div class="gcell bad">${ic('xcirc')}<span>${esc(guardById(gid).name)} no longer valid</span></div>`:''}</td><td>${ev?scoreBar(ev.score):'<span style="color:var(--muted)">—</span>'}</td><td>${stt.html}</td></tr>
        ${exp?`<tr class="detail"><td colspan="7">${detailHTML(sid, rd)}</td></tr>`:''}`;
    }).join('')}</tbody></table></div>`;
}
const BLOCK_TEXT = {
  'Qualification mismatch': (n,sh)=>`${n} guard${n>1?'s':''} lack the required qualification (${sh.req.join(' + ')})`,
  'Certification expired': n=>`${n} guard${n>1?'s have':' has'} an expired required certification`,
  'Missing required skill': (n,sh)=>`${n} guard${n>1?'s are':' is'} missing a required skill (${reqSkills(sh).join(', ')})`,
  'Department mismatch': (n,sh)=>`${n} guard${n>1?'s are':' is'} outside the required department (${sh.dept})`,
  'Unavailable for full shift': n=>`${n} guard${n>1?'s are':' is'} not available for the complete shift`,
  'Overlapping shift': n=>`${n} guard${n>1?'s have':' has'} an overlapping shift`,
  'Cannot reach site in time': n=>`${n} guard${n>1?'s':''} cannot travel from another shift in time`,
  'Insufficient rest': n=>`${n} guard${n>1?'s do':' does'} not have the minimum ${S.rules.restHours}h rest between shifts`,
  'Not cleared for site': (n,sh)=>`${n} guard${n>1?'s are':' is'} not cleared for ${SITES[sh.site].name}`,
  'Weekly hour limit exceeded': n=>`${n} guard${n>1?'s':''} would exceed ${S.rules.maxHoursCap}h this week`,
  'Overtime not allowed': n=>`${n} guard${n>1?'s':''} would go into overtime (not allowed)`,
  'Guard inactive': n=>`${n} guard${n>1?'s are':' is'} inactive`,
};
function excludedTable(rd){
  return `<div class="excl"><table>${rd.excluded.map(ev=>`<tr><td>${esc(ev.guard.name)}</td><td>${ev.blocking.map(c=>`<span class="x-reason">✕ Not Eligible – ${esc(c.blockLabel)}: ${esc(c.detail)}</span>`).join('')}</td></tr>`).join('')}</table></div>`;
}
const TIERS = {
  rec: {label:'Recommended', cls:'t-high'},
  elig:{label:'Eligible', cls:'t-rec'},
  warn:{label:'Warning', cls:'t-low'},
  ne:  {label:'Not Eligible', cls:'t-attn'},
};
function scoreTier(score){ return score>=80?'rec':'elig'; }
function tierBadge(t){ return `<span class="tbadge ${TIERS[t].cls}">${TIERS[t].label}</span>`; }
function majorWarn(ev){ return ev.warnings.filter(w=>w.major); }
function warnChip(ev){ const m=majorWarn(ev); return m.length?`<span class="tbadge t-low" title="${esc(m.map(w=>w.text).join(' • '))}">⚠ Warning</span>`:''; }
function shiftReqHTML(sh){
  const rs=reqSkills(sh), ps=shiftSkills(sh).filter(k=>!rs.includes(k)), site=SITES[sh.site], dm=deptMode(sh);
  return `<div class="fillbox"><div class="fb-h">${ic('cal')}<b>Shift to fill</b><span>${fmtDay(sh.date)} · ${sh.start}–${sh.end} (${shHours(sh)}h, ${shiftType(sh)}) · ${esc(site.name)} · ${esc(sh.post)} · ${sh.status==='open'?'Open':'Vacant'}${sh.note?' · '+esc(sh.note):''}</span></div>
    <div class="fb-reqs">
      <span class="rq"><i>Qualification</i>${sh.req.map(q=>`<b class="req">${esc(q)}</b>`).join('')}${sh.pref.map(q=>`<b class="pref">${esc(q)}</b>`).join('')}</span>
      <span class="rq"><i>Skills</i>${rs.map(q=>`<b class="req">${esc(q)}</b>`).join('')}${ps.map(q=>`<b class="pref">${esc(q)}</b>`).join('')}${!rs.length&&!ps.length?'<b class="none">None</b>':''}</span>
      <span class="rq"><i>Department</i><b class="${dm==='required'?'req':'pref'}">${esc(sh.dept)}</b></span>
      <span class="rq"><i>Site clearance</i><b class="${site.restricted?'req':'none'}">${site.restricted?'Required':'Not required'}</b></span>
      <span class="rq legend"><b class="req">Required</b><b class="pref">Preferred</b></span>
    </div></div>`;
}
function checklistHTML(ev){
  return `<ul class="hrlist">${ev.checks.map(c=>`<li class="${!c.on?'off':c.pass?'pass':'fail'}">${!c.on?ic('info'):c.pass?ic('check','okc'):ic('xcirc','bc')}<span><b>${esc(c.label)}</b>${!c.on?' <em>(rule off)</em>':''}<small>${esc(c.detail)}</small></span></li>`).join('')}</ul>`;
}
function contextHTML(ev){
  const sh=ev.shift, P=ev.ctx.prev, N=ev.ctx.next;
  const line=(L,dir)=>{ if(!L) return `<div class="cx-row none"><span class="cx-k">${dir<0?'Previous shift':'Next shift'}</span><span>None in the schedule${dir<0?' before':' after'} this shift</span></div>`;
    const o=L.x.a.shift; const far=L.gap>48*60;
    return `<div class="cx-row ${L.gap<L.need?'bad':L.rest<(S.rules.restHours*60)?'bad':''}"><span class="cx-k">${dir<0?'Previous shift':'Next shift'}</span><span><b>${fmtDay(o.date)} ${o.start}–${o.end}</b> · ${esc(SITES[o.site].name)}${L.x.a.source==='batch'?' <em>(this run)</em>':''}<small>${far?'More than 48h away':(dir<0?'Ends ':'Starts ')+(dir<0?fmtT(L.x.r[1]):o.start)+' · gap '+hm(L.gap)+(L.tm?' · travel '+L.tm+' min':' · same site')+' · rest '+hm(L.rest)}</small></span></div>`; };
  return `<div class="cxbox">${line(P,-1)}<div class="cx-row this"><span class="cx-k">This shift</span><span><b>${fmtDay(sh.date)} ${sh.start}–${sh.end}</b> · ${esc(SITES[sh.site].name)}</span></div>${line(N,1)}
    <div class="cx-hours"><span>Week: <b>${ev.before}h</b> worked/scheduled + <b>${ev.shiftH}h</b> = <b>${ev.projected}h</b></span><span>Overtime after ${ev.otAt}h · Limit ${S.rules.maxHoursCap}h</span><span class="${ev.otH?'wc':'okc'}">${ev.otH?ev.otH+'h overtime'+(S.rules.overtimePolicy==='notallowed'?' (not allowed)':' (allowed, ranked lower)'):'No overtime'}</span></div></div>`;
}
function detailHTML(sid, rd){
  const sh = shiftById(sid);
  const top = shiftReqHTML(sh);
  if(!rd.eligible.length){
    const reasons = noEligibleSummary(rd.excluded);
    const relaxed = Object.values(S.rules.hard).filter(v=>!v).length;
    const near = rd.excluded.filter(e=>e.guard.status==='Active').sort((a,b)=>a.blocking.length-b.blocking.length || b.score-a.score).slice(0,3);
    return top+`<div class="noelig"><div class="card"><h4>${ic('alert')}No Eligible Guard Found</h4>
      <div>No guard passes every mandatory rule, so AI will not assign this shift. It stays ${sh.status==='open'?'open':'vacant'}.</div>
      <ul>${reasons.map(([k,n])=>`<li>${esc((BLOCK_TEXT[k]||(x=>x+' guard'+(x>1?'s fail':' fails')+' “'+k+'”'))(n,sh))}</li>`).join('')}</ul>
      <button class="link" data-act="toggle-excl" data-id="${sid}">${S.showExcl.has(sid)?'Hide details':'View every guard and the rule they fail'} ${ic('chevD')}</button>
      ${S.showExcl.has(sid)?excludedTable(rd):''}</div>
      <div class="side"><h5 class="sideh">Closest alternatives (not valid AI recommendations)</h5>
        ${near.map(e=>`<div class="near">${avatar(e.guard)}<div><b>${esc(e.guard.name)}</b><small class="bc">✕ ${esc(e.blocking.map(c=>c.blockLabel).join(', '))}</small><small>${esc(e.blocking[0].detail)}</small></div></div>`).join('')}
        <h5 class="sideh" style="margin-top:14px">What you can do</h5>
        <div class="confirm-list" style="margin-top:0">
          <div>${ic('clock')}<span>Leave the shift ${sh.status==='open'?'open':'vacant'} and fill it later.</span></div>
          <div>${ic('sliders')}<span>Change a hard rule or the shift's requirements, then re-run AI.${relaxed?` ${relaxed} rule${relaxed>1?'s are':' is'} already off.`:''}</span></div>
        </div>
        <button class="btn outline" data-act="rules" data-open="hard">${ic('sliders')} Adjust Rules</button></div></div>`;
  }
  const gid = selectedFor(sid), aiId = S.run.ai[sid];
  const focusId = S.focusG[sid] || gid || aiId || rd.eligible[0].ev.guard.id;
  const fxE = rd.eligible.find(x=>x.ev.guard.id===focusId);
  const fxX = !fxE ? rd.excluded.find(e=>e.guard.id===focusId) : null;
  const fx = fxE || (fxX ? {ev:fxX, excluded:true} : rd.eligible[0]);
  const ev = fx.ev;
  const valid = rd.eligible.filter(x=>!x.blockedLive), blocked = rd.eligible.filter(x=>x.blockedLive);
  const aiRow = valid.find(x=>x.ev.guard.id===aiId);
  const others = valid.filter(x=>x.ev.guard.id!==aiId);
  const optRow = (x, n)=>{
    const g=x.ev.guard, on = gid===g.id, isAI = g.id===aiId, dis = x.blockedLive, foc = focusId===g.id;
    const blk = x.ev.blocking[0];
    return `<div class="opt ${on?'on':''} ${foc?'focus':''} ${dis?'dis':''}" data-act="inspect-guard" data-sid="${sid}" data-gid="${g.id}" ${dis?'role="button" aria-label="View '+esc(g.name)+' (cannot be assigned)"':`role="radio" aria-checked="${on}"`} tabindex="0">
      <span class="radio"></span>${n?`<span class="rk">${n}</span>`:''}${avatar(g)}
      <div class="ot"><b><span class="gname">${esc(g.name)}</span>${dis?tierBadge('ne'):tierBadge(isAI?'rec':'elig')}${dis?'':warnChip(x.ev)}</b>
      ${dis?`<small class="bad">✕ Not available in this run – ${esc(blk?blk.detail:'conflicts with another selection')}</small>`:`<small>${x.ev.distance} mi · ${x.ev.projected}h this week${x.ev.otH?' · <span class="wc">'+x.ev.otH+'h OT</span>':''} · $${g.rate}/hr</small>`}</div>
      <span class="os">${x.ev.score}%</span>${foc?`<span class="viewing" aria-hidden="true">${ic('chevR')}</span>`:''}</div>`;
  };
  const exRow = e => `<div class="opt ne ${focusId===e.guard.id?'focus':''}" data-act="inspect-guard" data-sid="${sid}" data-gid="${e.guard.id}" role="button" tabindex="0" aria-label="View why ${esc(e.guard.name)} is not eligible">
      <span class="radio"></span>${avatar(e.guard)}<div class="ot"><b><span class="gname">${esc(e.guard.name)}</span>${tierBadge('ne')}</b><small class="bad">✕ ${esc(e.blocking[0].blockLabel)} – ${esc(e.blocking[0].detail)}${e.blocking.length>1?' (+'+(e.blocking.length-1)+' more)':''}</small></div>${focusId===e.guard.id?`<span class="viewing" aria-hidden="true">${ic('chevR')}</span>`:''}</div>`;
  const exAll = S.showExcl.has(sid), exList = rd.excluded.slice().sort((a,b)=>a.blocking.length-b.blocking.length);
  const note = S.run.notes[sid];
  const isAIfocus = ev.guard.id===aiId;
  // right pane
  let state;
  if(fx.excluded) state = `<div class="selstate bad">${ic('xcirc')}<span><b>Not Eligible – ${esc(ev.blocking[0].blockLabel)}.</b> ${esc(ev.blocking[0].detail)}. AI will not recommend or assign this guard.</span></div>`;
  else if(fx.blockedLive) state = `<div class="selstate bad">${ic('xcirc')}<span><b>Cannot be assigned here.</b> ${esc((ev.blocking[0]||{}).detail||'Conflicts with another selection in this run')}.</span><button class="btn sm outline" data-act="rerun-lock" data-sid="${sid}" data-gid="${ev.guard.id}">Assign here &amp; re-run AI for the other shifts</button></div>`;
  else if(gid===ev.guard.id) state = `<div class="selstate ok">${ic('check')}<span>${isAIfocus?'<b>Selected · AI recommendation.</b>':'<b>Selected by you.</b> AI recommended '+esc(aiRow?aiRow.ev.guard.name+' ('+aiRow.ev.score+'%)':'—')+'.'} Re-validated against the latest schedule: passes all ${ev.checks.filter(c=>c.on).length} hard rules.</span></div>`;
  else state = `<div class="selstate">${ic('info')}<span>Eligible. Click the guard on the left to select them for this shift.</span></div>`;
  let ranking = '';
  if(!fx.excluded){
    const factorRows = S.rules.factors.map(f=>{ const on=f.on; const v=ev.factors[f.key]||0;
      return `<tr class="${on?'':'off'}"><td class="fl"><b>${esc(f.label)}</b><small>${esc(ev.details[f.key]||'')}</small></td><td class="fw">${on?(factorPct(S.rules,f.key).toFixed(1)+'%'):'Off'}</td><td class="fb"><div class="bar"><span class="${scoreCls(v)}" style="width:${v}%"></span></div></td><td class="fv">${on?v:'—'}</td></tr>`; }).join('');
    const act = ev.activeFactors; const eq = act.every(x=>x.weight===act[0].weight);
    const calc = eq ? `(${act.map(x=>x.value).join(' + ')}) ÷ ${act.length} = ${(Math.round(ev.raw*10)/10)} → ${ev.score}%` : `${act.map(x=>x.value+'×'+(x.weight/ev.wsum*100).toFixed(1)+'%').join(' + ')} = ${(Math.round(ev.raw*10)/10)} → ${ev.score}%`;
    let explanation;
    if(isAIfocus) explanation = explain(ev);
    else if(aiRow){ const d = ev.score - aiRow.ev.score; explanation = `${ev.guard.name} scores ${Math.abs(d)} point${Math.abs(d)===1?'':'s'} ${d<=0?'below':'above'} the AI recommendation (${aiRow.ev.guard.name}, ${aiRow.ev.score}%). ` + explain(ev, 'They'); }
    else explanation = explain(ev, ev.guard.name+' is eligible: they');
    ranking = `<h5 class="sec-h">${ic('trend')}Ranking – how the score was calculated</h5>
      <table class="factors">${factorRows}<tr class="total"><td class="fl"><b>Final Score</b><small>${eq?'Average of '+act.length+' equally weighted factors':'Weighted average of '+act.length+' factors'}</small></td><td></td><td></td><td class="fv">${ev.score}%</td></tr></table>
      <div class="calc">${calc}</div>
      <p class="explain">${esc(explanation)}</p>
      <div class="lists"><div><h5>Key reasons</h5><ul>${ev.reasons.map(r=>`<li>${ic('check','okc')}${esc(r)}</li>`).join('')}</ul></div>
        <div><h5>Warnings</h5><ul>${ev.warnings.length?ev.warnings.map(w=>`<li class="${w.major?'':'minor'}">${ic(w.major?'alert':'info',w.major?'wc':'')}${esc(w.text)}</li>`).join(''):`<li style="color:var(--muted)">${ic('check','okc')}No warnings</li>`}</ul></div></div>`;
  }
  return top+`<div class="detail-grid"><div class="dpane">
      <h5>${ic('star')}AI Recommendation</h5>
      ${aiRow?optRow(aiRow,1):`<div class="note bad-note">${ic('alert')}<span>No valid recommendation in this run.${note&&note.kind==='starved'?' Every eligible guard is needed for another selected shift.':''}</span></div>`}
      <div class="subhead"><span>Other Eligible Guards (${others.length})</span><span>Score</span></div>
      ${others.length?others.map((x,i)=>optRow(x,i+2)).join(''):'<div class="note" style="margin-top:0">No other guard passes every hard rule.</div>'}
      ${blocked.length?`<div class="subhead"><span>Not available in this run (${blocked.length})</span></div><p class="mini-help">Eligible on their own, but already recommended for another selected shift they cannot also work.</p>${blocked.map(x=>optRow(x,0)).join('')}`:''}
      <div class="opt ${!gid?'on':''}" data-act="pick-guard" data-sid="${sid}" data-gid="" role="radio" aria-checked="${!gid}" tabindex="0"><span class="radio"></span><div class="ot"><b>Leave shift ${sh.status==='open'?'open':'vacant'}</b><small>Do not assign anyone for now</small></div></div>
      <div class="subhead ne-h"><span>Not Eligible (${rd.excluded.length})</span><span>Failed a hard rule</span></div>
      ${(exAll?exList:exList.slice(0,4)).map(exRow).join('')}
      ${exList.length>4?`<button class="link" data-act="toggle-excl" data-id="${sid}">${exAll?'Show fewer':'Show all '+exList.length+' not eligible guards'}</button>`:''}
    </div>
    <div class="dpane why-pane ${S.fadeKey===sid?'fade':''}">
      <h5>${ic('info')}${fx.excluded?'Why is this guard not eligible?':isAIfocus?'Why does AI recommend this guard?':'How does this guard compare?'}</h5>
      <div class="why-head">${avatar(ev.guard)}<div><div class="nm">${esc(ev.guard.name)}</div><div style="color:var(--muted);font-size:12.5px">${ev.guard.id} · ${esc(ev.guard.dept)} · $${ev.guard.rate}/hr</div></div>
        ${fx.excluded?'':`<span class="big">${ev.score}%</span>`}${fx.excluded||fx.blockedLive?tierBadge('ne'):tierBadge(isAIfocus?'rec':'elig')}${fx.excluded||fx.blockedLive?'':warnChip(ev)}
        <div class="actions"><button class="btn outline" data-act="history" data-gid="${ev.guard.id}" data-sid="${sid}">${ic('clock')} View Guard History</button></div></div>
      ${state}
      <h5 class="sec-h">${ic('check')}Hard rules – checked first (${ev.checks.filter(c=>c.on&&c.pass).length}/${ev.checks.filter(c=>c.on).length} passed)</h5>
      ${checklistHTML(ev)}
      <h5 class="sec-h">${ic('cal')}Guard's schedule around this shift</h5>
      ${contextHTML(ev)}
      ${ranking}
      ${note&&note.top&&note.chosen&&isAIfocus?`<div class="optimiz">${ic('route')}<span><b>Optimized across the run:</b> ${esc(guardById(note.top).name)} had the highest individual score (${note.topScore}%) but ${esc(note.reason)}.</span></div>`:''}
    </div></div>`;
}

  if(m.type==='cost' || m.type==='trend'){
    const [a,b]=viewRange(); const list=SHIFTS.filter(s=>s.date>=a&&s.date<=b);
    const asg=list.filter(s=>s.status==='assigned'); const hrs=asg.reduce((t,s)=>t+shHours(s),0); const openH=list.filter(isOpen).reduce((t,s)=>t+shHours(s),0);
    const cost=asg.reduce((t,s)=>t+shHours(s)*guardById(s.guardId).rate,0);
    if(m.type==='cost') return `<div class="pop" style="${pos}"><h4>Labor cost · ${esc(rangeLabel())}</h4><div class="kv"><span>Scheduled hours</span><b class="num">${hrs.toLocaleString()}h</b></div><div class="kv"><span>Estimated labor cost</span><b class="num">$${Math.round(cost).toLocaleString()}</b></div><div class="kv"><span>Average rate</span><b class="num">$${hrs?(cost/hrs).toFixed(2):'0.00'}/hr</b></div><div class="kv"><span>Unfilled hours</span><b class="num">${openH}h</b></div></div>`;
    const cov = Math.round(hrs/(hrs+openH)*1000)/10;
    return `<div class="pop" style="${pos}"><h4>Coverage · ${esc(rangeLabel())}</h4><div class="kv"><span>Shift hours covered</span><b class="num">${cov}%</b></div><div class="kv"><span>Open shifts</span><b class="num">${list.filter(s=>s.status==='open').length}</b></div><div class="kv"><span>Vacant shifts</span><b class="num">${list.filter(s=>s.status==='vacant').length}</b></div><div class="kv"><span>Unpublished assignments</span><b class="num">${asg.filter(s=>!s.published).length}</b></div></div>`;
  }
  return '';
}
function openMenu(type, el, opts={}){
  const r = el.getBoundingClientRect();
  const m = {type, top: Math.min(r.bottom+6, innerHeight-60), ...opts};
  if(opts.alignRight) m.right = Math.max(8, innerWidth - r.right); else m.left = Math.max(8, Math.min(r.left - 8, innerWidth - 300));
  S.menu = m; renderOverlays();
  // keep in viewport vertically
  const el2 = document.querySelector('#menus .menu, #menus .pop');
  if(el2){ const rr = el2.getBoundingClientRect(); if(rr.bottom > innerHeight-8){ S.menu.top = Math.max(8, r.top - rr.height - 6); renderOverlays(); } }
}

  const base = baseAssignments([sh.id]);
  const evs = GUARDS.map(g=>evaluate(g,tmp,base,S.rules));
  const elig = rank(evs.filter(e=>e.eligible)), excl = evs.filter(e=>!e.eligible);
  const reasons = noEligibleSummary(excl);
  const changed = draftReq.join('|')!==sh.req.join('|');
