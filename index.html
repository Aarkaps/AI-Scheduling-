const RC = {cx:200, cy:192, R:132, r0:44};
const BUDGET = 100;
function sumActive(r, exceptKey){ return r.factors.filter(f=>f.on && f.key!==exceptKey).reduce((t,f)=>t+f.weight,0); }
function capFor(r, k){ return Math.max(1, BUDGET - sumActive(r, k)); }
function pointsLeft(r){ return BUDGET - sumActive(r); }
function radarScale(r){ if(S.dragScale) return S.dragScale; const mx=Math.max(0,...r.factors.filter(f=>f.on).map(f=>f.weight)); return Math.max(10, Math.ceil(mx/5)*5); }
function axisAngle(i,n){ return -Math.PI/2 + i*2*Math.PI/n; }
function wrapLabel(t){ if(t.length<=14) return [t]; const w=t.split(' '); if(w.length<2) return [t]; let best=1, bd=1e9; for(let i=1;i<w.length;i++){ const a=w.slice(0,i).join(' ').length, b=w.slice(i).join(' ').length; if(Math.abs(a-b)<bd){bd=Math.abs(a-b);best=i;} } return [w.slice(0,best).join(' '), w.slice(best).join(' ')]; }
function radarInner(r){
  const fs = r.factors.filter(f=>f.on), n = fs.length; if(n<3) return `<text x="200" y="190" text-anchor="middle" class="rd-lbl">Turn on at least 3 factors to draw the chart</text>`;
  const {cx,cy,R} = RC; const max = radarScale(r);
  const r0 = RC.r0; const pt = (i,v) => { const a=axisAngle(i,n), rr=r0+(R-r0)*v/max; return [cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]; };
  let h = `<rect class="rd-bg" x="-70" y="-16" width="540" height="420"/>`;
  [.25,.5,.75,1].map(x=>x*max).forEach(v=>{ h += `<polygon class="rd-ring" points="${fs.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`; });
  
  fs.forEach((f,i)=>{ const [x,y]=pt(i,max); h += `<line class="rd-axis ${f.on?'':'off'}" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  const act = fs.map((f,i)=>({f,i})).filter(o=>o.f.on);
  if(act.length>=2) h += `<polygon class="rd-shape" points="${act.map(o=>pt(o.i,o.f.weight).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`;
  const totW = act.reduce((t,o)=>t+o.f.weight,0);
  h += `<text class="rd-scale" x="${cx+16}" y="${cy-R+4}">${max}</text><text class="rd-scale" x="${cx+16}" y="${cy-(RC.r0+(R-RC.r0)/2)+4}">${max/2}</text>`;
  h += `<circle class="rd-center" cx="${cx}" cy="${cy}" r="38"/><text class="rd-cval" x="${cx}" y="${cy+1}" text-anchor="middle">${totW}</text><text class="rd-csub" x="${cx}" y="${cy+14}" text-anchor="middle">Total Weight Points</text><text class="rd-csub2" x="${cx}" y="${cy+25}" text-anchor="middle">(100% Allocated)</text>`;
  fs.forEach((f,i)=>{
    const a=axisAngle(i,n), lx=cx+Math.cos(a)*(R+30), ly=cy+Math.sin(a)*(R+30), c=Math.cos(a);
    const anchor = Math.abs(c)<0.2?'middle':c>0?'start':'end';
    const lines = wrapLabel(f.label); const y0 = ly - (lines.length-1)*8 + (Math.sin(a)>0.6?6:Math.sin(a)<-0.6?-4:4);
    h += `<text class="rd-lbl ${f.on?'':'off'}" text-anchor="${anchor}" x="${lx.toFixed(1)}" y="${y0.toFixed(1)}">${lines.map((t,j)=>`<tspan x="${lx.toFixed(1)}" dy="${j?16:0}">${esc(t)}</tspan>`).join('')}</text>`;
  });
  fs.forEach((f,i)=>{ const [x,y]=pt(i,f.weight);
    if(!f.on){ h += `<g class="rd-node off" aria-hidden="true"><circle class="rd-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8"/></g>`; return; }
    h += `<g class="rd-node ${S.dragK===f.key?'drag':''}" data-k="${f.key}" tabindex="0" role="slider" aria-label="${esc(f.label)} weight" aria-valuemin="1" aria-valuemax="10" aria-valuenow="${f.weight}"><circle class="rd-hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17"/><circle class="rd-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/><text class="rd-val" x="${x.toFixed(1)}" y="${(y+3.6).toFixed(1)}" text-anchor="middle">${f.weight}</text></g>`; });
  return h;
}

/* Update everything weight-related in place: no container re-render */
function syncWeights(){
  const r = S.drawer && S.drawer.draft; if(!r) return;
  document.querySelectorAll('svg.radar').forEach(g=>{ g.innerHTML = radarInner(r); });
  r.factors.forEach(f=>{
    const inp=document.getElementById('w-'+f.key); if(inp && document.activeElement!==inp) inp.value=f.on?f.weight:0;
    const p=document.getElementById('pct-'+f.key); if(p) p.textContent = f.on?factorPct(r,f.key).toFixed(1)+'%':'0.0%';
    const cap=capFor(r,f.key);
    if(inp) inp.max=cap;
    const minus=document.querySelector(`.flist [data-act="w-step"][data-k="${f.key}"][data-d="-1"]`), plus=document.querySelector(`.flist [data-act="w-step"][data-k="${f.key}"][data-d="1"]`);
    if(minus) minus.disabled = !f.on || f.weight<=1;
    if(plus){ plus.disabled = !f.on || f.weight>=cap; plus.title = f.on&&f.weight>=cap ? 'No points left. Lower another factor first.' : ''; }
  });
  const ft=document.getElementById('ftotal'); if(ft) ft.innerHTML=totalRowHTML(r);
  const h=document.getElementById('radar-head'); if(h) h.innerHTML=radarHead(r);
  const hz=document.getElementById('radar-head-z'); if(hz) hz.innerHTML=radarHead(r,true);

  const st=row.querySelector('.stepper'); if(st) st.classList.toggle('dis', !on);

function setWeight(k, v){ const r=S.drawer.draft; const f=r.factors.find(x=>x.key===k); if(!f||!f.on) return; const nv=Math.max(1,Math.min(capFor(r,k),Math.round(v))); if(nv!==f.weight){ f.weight=nv; syncWeights(); } }
function radarPointer(e){
  const svg=S.dragSvg && document.getElementById(S.dragSvg); if(!svg) return;
  const r=S.drawer.draft; const actF=r.factors.filter(f=>f.on); const n=actF.length; const i=actF.findIndex(f=>f.key===S.dragK); if(i<0) return;
  const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse());
  const a=axisAngle(i,n); const proj=(q.x-RC.cx)*Math.cos(a)+(q.y-RC.cy)*Math.sin(a);

function positionQV(){
  const box=document.getElementById('qv-box'); if(!box||!S.qv) return;
  const a=document.querySelector(`.shift[data-id="${S.qv.anchor}"], tr[data-id="${S.qv.anchor}"]`); if(!a) return;
  const r=a.getBoundingClientRect(), w=box.offsetWidth, h=box.offsetHeight, m=8, W=innerWidth, H=innerHeight;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  let left, top;
  if(r.right+m+w <= W-m){ left=r.right+m; top=clamp(r.top, m, H-h-m); }
  else if(r.left-m-w >= m){ left=r.left-m-w; top=clamp(r.top, m, H-h-m); }
  else { left=clamp(r.left, m, W-w-m); top = (r.bottom+m+h <= H-m) ? r.bottom+m : clamp(r.top-m-h, m, H-h-m); }
  box.style.left=left+'px'; box.style.top=top+'px';
}

function cloneReq(r){ const e=emptyReq(); if(!r) return e; return { skills:r.skills.map(x=>({...x})), licenses:r.licenses.slice(), certifications:r.certifications.slice(), payMin:r.payMin, payMax:r.payMax, minExp:r.minExp, maxDist:r.maxDist, noOverride:(r.noOverride||[]).slice() }; }
function normReq(r){ return JSON.stringify({s:r.skills.map(x=>x.name+':'+x.level).sort(), l:r.licenses.slice().sort(), c:r.certifications.slice().sort(), a:r.payMin, b:r.payMax, e:r.minExp, d:r.maxDist, o:liveNoOverride(r).sort()}); }
/* only keys for requirements that are actually set count */
function liveNoOverride(r){ const live=new Set(r.skills.filter(x=>x.level==='required').map(x=>'skill:'+x.name).concat(r.licenses.map(x=>'license:'+x), r.certifications.map(x=>'cert:'+x), (r.payMin!=null||r.payMax!=null)?['pay']:[], r.minExp!=null?['exp']:[], r.maxDist!=null?['dist']:[])); return (r.noOverride||[]).filter(k=>live.has(k)); }
function psDirty(){ const p=S.ps; return !!p && p.mode==='edit' && normReq(p.draft)!==normReq(cloneReq(siteReq(p.siteId))); }
function guardLeave(go){ if(psDirty()){ S.modal={type:'leave'}; S.pendingNav=go; renderOverlays(); } else go(); }
function reqSummary(r){
  if(!hasReq(r)) return '<span class="muted">Not configured</span>';
  const parts=[];
  if(r.skills.length) parts.push(r.skills.length+' skill'+(r.skills.length===1?'':'s'));
  if(r.licenses.length) parts.push(r.licenses.length+' license'+(r.licenses.length===1?'':'s'));
  if(r.certifications.length) parts.push(r.certifications.length+' cert'+(r.certifications.length===1?'':'s'));
  if(r.payMin!=null||r.payMax!=null) parts.push(payText(r));
  if(r.minExp!=null) parts.push(r.minExp+'+ yr');
  if(r.maxDist!=null) parts.push('≤ '+r.maxDist+' mi');
  return parts.map(x=>`<span class="q">${esc(x)}</span>`).join('');
}
function reqImpact(r, siteId){
  const g=activeGuards(); if(!hasReq(r)) return {ok:g.length, total:g.length, reasons:[]};
  let ok=0, ovr=0; const counts={};
  g.forEach(x=>{ const m=checkReq(x, siteId, r); if(!m.fails.length) ok++; else if(!m.hard.length) ovr++; const seen=new Set(); m.fails.forEach(f=>{ if(seen.has(f.blockLabel)) return; seen.add(f.blockLabel); counts[f.blockLabel]=(counts[f.blockLabel]||0)+1; }); });
  return {ok, ovr, total:g.length, reasons:Object.entries(counts).sort((a,b)=>b[1]-a[1])};
}
function impactHTML(r, siteId){
  const m=reqImpact(r, siteId), none=!hasReq(r);
  const open = !none && S.ps && S.ps.impactOpen;
  return `<div class="ps-impact-wrap ${open?'open':''}"><div class="ps-impact ${m.ok<3&&!none?'low':''}">${ic('team')}<div class="pi-txt"><b>${none?'All '+m.total+' active guards can be considered':m.ok+' of '+m.total+' active guards meet these requirements'}</b>
    <small>${none?'No guard is filtered out for this post site. Scheduling rules still apply.':(m.ovr?m.ovr+' more can be assigned with a scheduler override · ':'')+m.reasons.slice(0,3).map(([k,n])=>n+' '+k.toLowerCase()).join(' · ')}${m.ok<3&&!none?' · Few guards qualify, so AI may not find a match for every shift.':''}</small></div>
    ${none?'':`<button class="btn sm outline pi-btn" data-act="imp-toggle" aria-expanded="${!!open}">${ic(open?'chevU':'chevD')} ${open?'Hide guards':'View guards'}</button>`}</div>
    ${open?impactListHTML(r, siteId):''}</div>`;
}
/* Guard-by-guard breakdown under the impact line: who passes, who needs attention and why */
function impactListHTML(r, siteId){
  const rows = activeGuards().map(g=>({g, m:checkReq(g, siteId, r)}));
  const pass = rows.filter(x=>!x.m.fails.length).sort((a,b)=>a.g.name.localeCompare(b.g.name));
  const attn = rows.filter(x=>x.m.fails.length).sort((a,b)=>(a.m.hard.length>0)-(b.m.hard.length>0) || a.m.fails.length-b.m.fails.length || a.g.name.localeCompare(b.g.name));
  const tab = S.ps.impactTab || 'attn';
  const fixable = f => /^psr:(skill|license|cert):/.test(f.key);
  const row = x => { const g=x.g, m=x.m;
    const ex = exemptFor(siteId, g.id);
    const tag = !m.fails.length ? (m.exempt.length?`<span class="pi-tag ovr">${ic('check')}Override approved</span>`:m.partial?`<span class="pi-tag part">${ic('alert')}Preferred skill missing</span>`:'')
      : m.hard.length ? `<span class="pi-tag bad">${ic('xcirc')}Not eligible</span>` : '';
    const fx = m.fails.filter(fixable), canOv = m.fails.length && !m.hard.length && S.ps.mode!=='edit';
    const items = [];
    if(fx.length) items.push(`<button role="menuitem" data-act="imp-fix" data-gid="${g.id}" data-keys="${esc(fx.map(f=>f.key).join('|'))}">${ic('plusc')}<span><b>Add missing to profile</b><small>${esc(fx.map(f=>f.status==='Missing'?f.req:f.detail).join(', '))}</small></span></button>`);
    if(canOv) items.push(`<button role="menuitem" data-act="site-ovr" data-gid="${g.id}">${ic('alert')}<span><b>Override for this post site</b><small>Approve with a reason. AI treats them as eligible here.</small></span></button>`);
    if(m.exempt.length && S.ps.mode!=='edit') items.push(`<button role="menuitem" data-act="site-ovr-remove" data-gid="${g.id}">${ic('x')}<span><b>Remove override</b><small>They'll need attention again</small></span></button>`);
    items.push(`<button role="menuitem" data-act="history" data-gid="${g.id}">${ic('team')}<span><b>View profile</b></span></button>`);
    const open = S.ps.piMenu===g.id, primary = m.fails.length && (fx.length||canOv);
    return `<div class="pi-row">${avatar(g)}
      <div class="pi-info"><div class="pi-name"><b>${esc(g.name)}</b>${tag}</div>
        <small>${g.id} · ${esc(g.dept)} · ${distTo(g,siteId)} mi · $${g.rate}/hr · ${g.years} yr${g.years===1?'':'s'}</small>
        ${m.fails.length?`<ul class="pi-fails">${m.fails.map(f=>`<li>${ic('xcirc', f.overridable?'wc':'bc')}<span>${esc(f.status==='Missing'?'Missing '+f.req:f.cat+': '+f.detail)}</span>${f.overridable?'':'<em class="ovt no">No override</em>'}</li>`).join('')}</ul>`:''}
        ${m.exempt.length?`<div class="pi-ex">${ic('check')}<span>Override approved for ${esc(m.exempt.map(f=>f.status==='Missing'?f.req:f.req.replace('Within ','within ').replace('Minimum ','minimum ')).join(', '))} · ${esc(ex.reason)}${ex.note?' (“'+esc(ex.note)+'”)':''} · ${esc(ex.by)}, ${esc(ex.at)}</span></div>`:''}</div>
      <div class="pi-act"><button class="btn sm ${primary?'outline':'ghost'} pi-btn2" data-act="pi-menu" data-gid="${g.id}" aria-haspopup="menu" aria-expanded="${open}">${primary?'Resolve':'Actions'} ${ic(open?'chevU':'chevD')}</button>
        ${open?`<div class="pi-pop" role="menu">${items.join('')}</div>`:''}</div></div>`; };
  const list = tab==='pass' ? pass : attn;
  return `<div class="pi-list"><div class="pi-tabs" role="tablist">
      <button role="tab" class="${tab==='pass'?'on':''}" aria-selected="${tab==='pass'}" data-act="imp-tab" data-t="pass">${ic('check')}Passed <span>${pass.length}</span></button>
      <button role="tab" class="${tab==='attn'?'on':''}" aria-selected="${tab==='attn'}" data-act="imp-tab" data-t="attn">${ic('alert')}Needs attention <span>${attn.length}</span></button></div>
    ${tab==='attn'&&attn.length?`<div class="pi-help">${ic('info')}<span>Use <b>Resolve</b> on a guard to add missing skills, licenses or certifications to their profile, or to approve an override for this post site. Guards marked <b>Not eligible</b> fail a requirement that can't be overridden.</span></div>`:''}
    <div class="pi-rows">${list.length?list.map(row).join(''):`<div class="pi-empty">${tab==='pass'?'No guard meets every requirement yet.':'Every active guard meets these requirements.'}</div>`}</div></div>`;
}

  'ovr-cancel': (t,e) => { if(t.classList.contains('drawer-scrim') && e.target!==t) return; const back = S.ovr && S.ovr.ctx; S.ovr=null; renderOvr(); if(back==='results') render(); },
  'ovr-confirm': () => { const o=S.ovr;
    if(!o.reason){ o.err='Select a reason for the override.'; renderOvr(); document.getElementById('ovr-reason').focus(); return; }
    if(o.reason==='Other' && (o.note||'').trim().length<5){ o.err='Describe the reason (at least 5 characters).'; renderOvr(); const n=document.getElementById('ovr-note'); if(n) n.focus(); return; }
    if(o.ctx==='site'){ const g=guardById(o.gid), m=checkReq(g, o.siteId), site=SITES[o.siteId];
      SITE_EXEMPT[o.siteId] = SITE_EXEMPT[o.siteId] || {};
      const prev = exemptFor(o.siteId, o.gid);
      SITE_EXEMPT[o.siteId][o.gid] = {keys:(prev?prev.keys:[]).concat(m.soft.map(f=>f.key.replace(/^psr:/,''))), conflicts:(prev?prev.conflicts:[]).concat(m.soft.map(f=>({cat:f.cat, req:f.req, status:f.status}))),
        reason:o.reason, note:o.reason==='Other'?o.note.trim():'', by:'Kapil', at:nowStamp(), standing:true};
      S.ovr=null; renderOvr(); S.reqVer++; refreshImpact(); toast('Override approved: '+g.name+' can now be scheduled at '+site.name+'.','alert'); return; }
    const {g, ev} = ovrEval(o);
    const rec = {gid:o.gid, guardName:g.name, conflicts:ev.blocking.filter(b=>b.psr).map(b=>({cat:b.cat||'', req:b.req, status:b.status})), reason:o.reason, note:o.reason==='Other'?o.note.trim():'', by:'Kapil', at:nowStamp()};
    S.ovr=null; renderOvr();
    if(o.ctx==='results'){ S.overrides[o.sid]=rec; S.sel[o.sid]=o.gid; S.manual[o.sid]=null; S.focusG[o.sid]=o.gid; S.pick.add(o.sid); render();
      toast(g.name+' selected with a requirement override. Approve or Publish to create the assignment.','alert'); }
    else if(o.ctx==='edit'){ S.modal.draft.ovr = rec; A['edit-save'](); }
    else if(o.ctx==='qv'){ const sh=shiftById(o.sid); qvApply(sh, o.gid, false, rec); }
  },
  'ovr-info': (t,e) => { if(e) e.stopPropagation(); const sh=shiftById(t.dataset.id); if(!sh||!sh.override) return; S.qv=null; renderQV(); S.menu=null; S.modal={type:'ovr-info', id:sh.id}; renderOverlays(); },
});
Object.assign(CH, { 'ovr-reason': t => { S.ovr.reason=t.value; S.ovr.err=''; renderOvr(); const n=document.getElementById(t.value==='Other'?'ovr-note':'ovr-reason'); if(n) n.focus(); } });
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset && t.dataset.in==='ovr-note' && S.ovr){ S.ovr.note=t.value; const ok=(t.value||'').trim().length>=5; const b=document.getElementById('ovr-go'); if(b){ if(ok) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled','true'); } } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.ovr){ e.stopImmediatePropagation(); S.ovr=null; renderOvr(); } }, true);

renderShell();
render();

</script>
