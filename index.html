function guardHistory(g){
  const out = [];
  SHIFTS.filter(s=>s.guardId===g.id && s.status==='assigned' && s.date>='2026-09-26' && s.date<='2026-10-13').forEach(s=>{
    out.push({date:s.date,start:s.start,end:s.end,site:s.site,post:s.post,type:shiftType(s),hours:shHours(s),status:s.date<TODAY?'Completed':'Assigned'});
  });
  const sites = Object.keys(g.siteHist).length ? Object.keys(g.siteHist) : g.cleared;
  const T = {Day:['07:00','15:00'],Evening:['15:00','23:00'],Overnight:['22:00','06:00']}[g.prefShifts[0]];
  for(let i=0;i<5;i++){
    const site = sites[i%sites.length]; const post = (g.postHist.find(p=>p.startsWith(site+'|'))||'|'+SITES[site].posts[0]).split('|')[1];
    const date = addDays('2026-09-25', -i*2-(i%2));
    out.push({date,start:T[0],end:T[1],site,post,type:g.prefShifts[0],hours:8,status:'Completed', flag: (i===2 && g.onTime<92) ? 'Late clock-in 12m' : (i===4 && g.att<90 ? 'Call-off' : '')});
  }
  return out.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}

/* ---------- AI flow ---------- */
function startRun(ids){
  S.menu=null; S.mode=null; S.selected.clear();
  S.run = runBatch(ids, S.rules);
  S.sel = {...S.run.ai}; S.manual = {}; S.expanded = new Set(); S.focusG = {}; S.showExcl = new Set();
  // expand the first row with a recommendation for a guided review
  S.modal = {type:'processing', step:0, n:ids.length};
  render();
  const tick = () => {
    if(!S.modal || S.modal.type!=='processing') return;
    S.modal.step++;
    if(S.modal.step>=7){ setTimeout(()=>{ S.modal={type:'complete'}; renderOverlays(); }, reduceMotion?50:350); renderOverlays(); return; }
    renderOverlays(); setTimeout(tick, reduceMotion?60:340);
  };
  setTimeout(tick, reduceMotion?60:340);
}
function requestPublish(ids){
  const issues = validateAssignments(ids, S.rules);
  S.modal = issues.length ? {type:'pubstale', ids, issues} : {type:'publish', ids};
  renderOverlays();
}
/* Demo only: emulate another scheduler/process changing the schedule after AI ran */
function simulateChange(){
  let target=null, label='';
  if(S.screen==='results' && S.run){
    const sid = S.run.shiftIds.slice().sort((a,b)=>range(shiftById(a))[0]-range(shiftById(b))[0]).find(id=>S.sel[id]);
    if(sid) target={sh:shiftById(sid), gid:S.sel[sid]};
  } else {
    const u = SHIFTS.filter(x=>x.status==='assigned' && !x.published).sort((a,b)=>range(a)[0]-range(b)[0])[0];
    if(u) target={sh:u, gid:u.guardId};
  }
  if(!target){ toast('Nothing to change: there are no AI selections or unpublished assignments yet.','info'); return; }
  const other = Object.keys(SITES).find(k=>k!==target.sh.site && !SITES[k].restricted) || 'MCT';
  const st = toMin(target.sh.start)-120, stT = pad(Math.floor(((st%1440)+1440)%1440/60))+':'+pad(((st%60)+60)%60);
  const n = {id:'SH-'+(seq++), date:target.sh.date, start:stT, end:target.sh.start==='00:00'?'23:00':pad(Math.floor((toMin(target.sh.start)+120)%1440/60))+':'+pad(toMin(target.sh.start)%60), site:other, post:SITES[other].posts[0], dept:SITES[other].dept, req:[], pref:[], status:'assigned', guardId:target.gid, published:true, note:'Added by another scheduler'};
  SHIFTS.push(n); S.flash=new Set([n.id]); render(); setTimeout(()=>S.flash.clear(),1700);
  toast('Simulated: another scheduler assigned '+guardById(target.gid).name+' to '+fmtShort(n.date)+' '+n.start+'–'+n.end+' at '+SITES[other].name+'. '+(S.screen==='results'?'Apply':'Publish')+' will now re-validate.','info');
}
function schedulerLocks(){ const L={}; if(!S.run) return L; S.run.shiftIds.forEach(sid=>{ const gid=S.sel[sid]||null; if(gid!==(S.run.ai[sid]||null) || S.manual[sid]==='skip') L[sid]=gid; }); return L; }
function recalc(msg, extraLocks){
  if(!S.run) return;
  const before = {...S.sel};
  const locks = Object.assign(schedulerLocks(), extraLocks||{});
  const ids = S.run.shiftIds.filter(id=>{ const x=shiftById(id); return x && (x.status!=='assigned'); });
  S.run = runBatch(ids, S.rules, locks);
  S.sel = {...S.run.ai}; S.focusG = {}; Object.keys(S.manual).forEach(k=>{ if(!(k in locks)) delete S.manual[k]; });
  const changed = ids.filter(id=>(before[id]||null)!==(S.sel[id]||null)).length;
  toast((msg || 'AI re-ran on the latest schedule.')+' '+changed+' recommendation'+(changed===1?'':'s')+' changed'+(Object.keys(locks).length?'; your '+Object.keys(locks).length+' selection'+(Object.keys(locks).length===1?' was':'s were')+' kept':'')+'.', 'refresh');
}
function applyRun(){
  const created = [];
  S.run.shiftIds.forEach(sid=>{
    const gid = selectedFor(sid); if(!gid) return;
    const sh = shiftById(sid); const rd = rowData(sid); const f = rd.eligible.find(x=>x.ev.guard.id===gid); if(!f || f.blockedLive) return; const ev = f.ev;
    created.push({sh, gid, score:ev.score, manual: gid!==S.run.ai[sid], ai:S.run.ai[sid]});
  });
  created.forEach(c=>{ Object.assign(c.sh, {status:'assigned', guardId:c.gid, published:false, ai:true, aiScore:c.score, aiRec:c.ai}); });
  S.lastApplied = created.map(c=>c.sh.id);
  return created.length;
}

function editRank(s, d){

  return { elig: rank(evs.filter(e=>e.eligible)), inel: evs.filter(e=>!e.eligible) };
}

}

function hardRowHTML(r,k,l,dsc){

  </div></div>`;
}
function condControl(c, attrs){

    <button class="x sm del hov" data-act="h-del" data-k="${c.key}" aria-label="Remove ${esc(c.label)}">${ic('trash')}</button></div>`;

const RC = {cx:200, cy:192, R:132, r0:44};
const BUDGET = 100;
function sumActive(r, exceptKey){ return r.factors.filter(f=>f.on && f.key!==exceptKey).reduce((t,f)=>t+f.weight,0); }
function capFor(r, k){ return Math.max(1, BUDGET - sumActive(r, k)); }
function pointsLeft(r){ return BUDGET - sumActive(r); }
function radarScale(r){ if(S.dragScale) return S.dragScale; const mx=Math.max(0,...r.factors.filter(f=>f.on).map(f=>f.weight)); return Math.max(10, Math.ceil(mx/5)*5); }
function axisAngle(i,n){ return -Math.PI/2 + i*2*Math.PI/n; }
function wrapLabel(t){ if(t.length<=14) return [t]; const w=t.split(' '); if(w.length<2) return [t]; let best=1, bd=1e9; for(let i=1;i<w.length;i++){ const a=w.slice(0,i).join(' ').length, b=w.slice(i).join(' ').length; if(Math.abs(a-b)<bd){bd=Math.abs(a-b);best=i;} } return [w.slice(0,best).join(' '), w.slice(best).join(' ')]; }
function radarInner(r){
  const fs = r.factors.filter(f=>f.on), n = fs.length; if(n<3) return `<text x="200" y="190" text-anchor="middle" class="rd-lbl">Turn on at least 3 factors to draw the chart</text>`;
  const {cx,cy,R} = RC; const max = radarScale(r);
  const r0 = RC.r0; const pt = (i,v) => { const a=axisAngle(i,n), rr=r0+(R-r0)*v/max; return [cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]; };
  let h = `<rect class="rd-bg" x="-70" y="-16" width="540" height="420"/>`;
  [.25,.5,.75,1].map(x=>x*max).forEach(v=>{ h += `<polygon class="rd-ring" points="${fs.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`; });
  
  fs.forEach((f,i)=>{ const [x,y]=pt(i,max); h += `<line class="rd-axis ${f.on?'':'off'}" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  const act = fs.map((f,i)=>({f,i})).filter(o=>o.f.on);
  if(act.length>=2) h += `<polygon class="rd-shape" points="${act.map(o=>pt(o.i,o.f.weight).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`;

});
/* Toggles and parameter edits: update state + DOM in place, never re-render the modal */
CH['rule-factor'] = t => { const r=S.drawer.draft; const f=r.factors.find(x=>x.key===t.dataset.k);
  if(t.checked){ const avail = BUDGET - sumActive(r, f.key); if(avail<1){ t.checked=false; toast('All '+BUDGET+' points are allocated. Lower another factor to turn this one on.','info'); return; } if(f.weight>avail){ f.weight=avail; toast(f.label+' turned on at '+avail+' points (the points left in the budget).','info'); } }
  f.on=t.checked;
  if(!r.factors.some(x=>x.on)){ f.on=true; t.checked=true; toast('At least one scoring factor must apply.','info'); return; }
  setRowState(t.closest('.frow'), f.on); syncWeights(); };
CH['rule-hard'] = t => { S.drawer.draft.hard[t.dataset.k]=t.checked; setRowState(t.closest('.rule'), t.checked); syncWeights(); };
CH['rule-chard'] = t => { const c=S.drawer.draft.customHard.find(x=>x.key===t.dataset.k); c.on=t.checked; setRowState(t.closest('.rule'), t.checked); syncWeights(); };
CH['chard-val'] = t => { const c=S.drawer.draft.customHard.find(x=>x.key===t.dataset.k); const T=HARD_TEMPLATES[c.cond]; if(T.kind==='select') c.value=t.value; else { let v=parseFloat(t.value); if(isNaN(v)) v=c.value; c.value=Math.max(T.min,Math.min(T.max,v)); t.value=c.value; } syncWeights(); };
CH['rule-num'] = t => { const v=parseFloat(t.value); if(!isNaN(v)) S.drawer.draft[t.dataset.k]=v; else t.value=S.drawer.draft[t.dataset.k]; syncWeights(); };
CH['rule-sel'] = t => { S.drawer.draft[t.dataset.k]=t.value; syncWeights(); };

/* ---- accordion sections in the rules modal ---- */
function accHTML(id, title, sub, badge, inner){
  const open = !!(S.drawer.open && S.drawer.open[id]);
  const add = id==='hard' ? `<button class="btn sm add-btn" data-act="f-add" data-t="hard">${ic('plusc')} Add Hard Rule <span class="admin-tag">Admin</span></button>`
            : id==='factors' ? `<button class="btn sm add-btn" data-act="f-add" data-t="factor">${ic('plusc')} Add Factor <span class="admin-tag">Admin</span></button>` : '';
  return `<section class="acc ${open?'open':''}" data-acc="${id}"><div class="acc-h" data-act="acc" data-s="${id}">
      <button class="acc-toggle" aria-expanded="${open}" aria-controls="acc-${id}">${ic('chevR','acc-chev')}<span class="acc-t"><b>${title}</b><small>${sub}</small></span><span class="acc-badges" id="accb-${id}">${badge}</span></button>${add}</div>
    <div class="acc-b" id="acc-${id}" ${open?'':'inert'}><div class="acc-in"><div class="acc-pad">${inner}</div></div></div></section>`;
}
function accBadge(id, r){
  if(id==='hard'){ const ch=r.customHard||[]; const on=Object.values(r.hard).filter(Boolean).length+ch.filter(c=>c.on).length, tot=Object.keys(r.hard).length+ch.length;
    return `<span class="rtag strong">${on} Active Rule${on===1?'':'s'}</span>${on<tot?`<span class="rtag warnb">${tot-on} off</span>`:''}${ch.length?`<span class="rtag">${ch.length} custom</span>`:''}`; }
  if(id==='factors'){ const act=activeFactors(r); const eq=act.every(f=>f.weight===act[0].weight);
    return `<span class="rtag strong">${act.length} Active Factor${act.length===1?'':'s'}</span>${act.length<r.factors.length?`<span class="rtag warnb">${r.factors.length-act.length} off</span>`:''}<span class="rtag ${eq?'ok':''}">${eq?'Equal weights':'Custom weights'}</span>`; }
  return `<span class="rtag strong">4 Checks</span><span class="rtag">Travel &gt; ${r.travelWarn} mi · Rest &lt; ${r.restWarn}h</span>`;
}
function syncBadges(){ const r=S.drawer && S.drawer.draft; if(!r) return; ['hard','factors','warn'].forEach(id=>{ const el=document.getElementById('accb-'+id); if(el) el.innerHTML=accBadge(id,r); }); }
A['acc'] = t => {
  const id=t.dataset.s; S.drawer.open = S.drawer.open||{}; S.drawer.open[id]=!S.drawer.open[id];
  const sec=t.closest('.acc'); const body=sec.querySelector('.acc-b');
  sec.classList.toggle('open', S.drawer.open[id]); sec.querySelector('.acc-toggle').setAttribute('aria-expanded', S.drawer.open[id]);
  if(S.drawer.open[id]) body.removeAttribute('inert'); else body.setAttribute('inert','');
};

/* ---------- Shift quick-view popover (light) ---------- */
const SITE_CODE = { ABC:'1000', XYZ:'1001', RMP:'1002', HLW:'1003', MCT:'1004' };
const TYPE_TITLE = { Day:'Day Patrol', Evening:'Evening Patrol', Overnight:'Night Patrol' };
function fmtDT(t){ const d=new Date(t); return MON[d.getUTCMonth()]+' '+pad(d.getUTCDate())+', '+d.getUTCFullYear()+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes()); }
function qvRank(s){ const base=baseAssignments([s.id]); return rank(GUARDS.map(g=>evaluate(g,s,base,S.rules)).filter(e=>e.eligible)); }
function openQV(id, anchorEl){
  const s=shiftById(id); const elig=qvRank(s); let gid=s.guardId, auto=false;
  if(isOpen(s) && elig[0]){ gid=elig[0].guard.id; auto=true; }
  S.qv={id, gid, auto, open:false, anchor:id};
  renderQV();
}
function qvHeaderBadge(s, top){
  if(s.status==='open') return `<span class="qv-state open">Open</span>`;
  if(s.status==='vacant') return `<span class="qv-state vacant">Vacant</span>`;
  const aiTop = top && s.guardId===top.guard.id;
  return `<span class="qv-state ${aiTop?'ai':'asg'}">${aiTop?'AI Recommended':'Assigned'}</span>`;
}
function qvHTML(){
  const q=S.qv; if(!q) return '';
  const s=shiftById(q.id); if(!s){ return ''; }
  const [st,en]=range(s); const type=shiftType(s), site=SITES[s.site];
  const elig=qvRank(s); const top=elig[0];
  const g=q.gid?guardById(q.gid):null; const gev=g?elig.find(e=>e.guard.id===g.id):null;
  const hrs=shHours(s), brk = hrs>=8 ? 'Break End Notify(0:30)' : 'Break End Notify(0:15)';
  const pending = (q.gid||null)!==(s.guardId||null);
  const pubBtn = s.status==='assigned' ? (s.published ? `<button class="qv-act" data-act="qv-unpub">Unpublish</button>` : `<button class="qv-act pub" data-act="qv-pub">Publish</button>`) : '';
  const isTopSel = top && g && top.guard.id===g.id && pending;
  const list = q.open ? `<div class="qv-dd" role="listbox">
      ${elig.length?elig.map((e,i)=>`<div class="qv-opt ${q.gid===e.guard.id?'on':''} ${s.guardId===e.guard.id?'saved':''}" role="option" aria-selected="${q.gid===e.guard.id}" tabindex="0" data-act="qv-pick" data-gid="${e.guard.id}"><span class="qv-on">${esc(e.guard.name)}${i===0?'<em class="qv-ai">Top Match</em>':''}${s.guardId===e.guard.id?'<em class="qv-cur">Current</em>':''}</span><span class="qv-pct">${e.score}% Match</span><small>${i===0?'Recommended':'Eligible'}${majorWarn(e).length?' · ⚠ '+esc(majorWarn(e)[0].type):''} · ${e.distance} mi${e.warnings.length?' · ⚠ '+e.warnings.length:''}</small>${s.guardId===e.guard.id?'':`<button class="qv-assign" data-act="qv-assign" data-gid="${e.guard.id}" aria-label="Assign ${esc(e.guard.name)}">Assign</button>`}</div>`).join(''):`<div class="qv-empty">No guard passes every hard rule for this shift.</div>`}
      <div class="qv-opt none ${!q.gid?'on':''}" role="option" aria-selected="${!q.gid}" tabindex="0" data-act="qv-none"><span class="qv-on">No Guard (Open)</span><small>${s.guardId?'Unassigns the current guard straight away':'Keep the shift without a guard'}</small></div></div>` : '';
  let hint='';
  if(q.saved && !pending) hint = `<div class="qv-hint ok">${q.saved}</div>`;
  else if(pending && q.auto && isTopSel && !q.open) hint = `<div class="qv-hint">Pre-selected by AI. Click ✓ or Save Assignment to assign.</div>`;
  else if(pending) hint = `<div class="qv-hint pend">Not saved yet. Click ✓ or Save Assignment.</div>`;
  if(g && !gev) hint += `<div class="qv-hint warn">${esc(g.name)} fails a hard rule for this shift.</div>`;
  return `<div class="qv" role="dialog" aria-label="Shift details" id="qv-box">
    <div class="qv-h"><span class="qv-title">${TYPE_TITLE[type]}</span><span class="qv-hr">${qvHeaderBadge(s, top)}${pubBtn}</span></div>
    <div class="qv-b">
      <div class="qv-r"><b>Start :</b> ${fmtDT(st)}</div>
      <div class="qv-r"><b>End :</b> ${fmtDT(en)}</div>
      <div class="qv-r"><b>Type :</b> Standard</div>
      <div class="qv-r"><b>Post Site :</b> ${SITE_CODE[s.site]} <span class="qv-sub">${esc(site.name)} · ${esc(s.post)}</span></div>
      <div class="qv-r"><b>Guard :</b>${isTopSel?'<span class="qv-ai">AI Recommended</span>':''}</div>
      <div class="qv-g">
        <button class="qv-field" data-act="qv-toggle" aria-haspopup="listbox" aria-expanded="${q.open}"><span>${g?esc(g.name):'No Guard (Open)'}</span>${gev?`<small>${gev.score}%</small>`:''}<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${q.open?I.chevU:I.chevD}</svg></button>
        <button class="qv-ic save ${pending&&q.gid?'active':''}" data-act="qv-save" data-tip="Save &amp; Assign Guard" aria-label="Save and assign guard" ${pending&&q.gid?'':'aria-disabled="true"'}><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none"/></svg></button>
        <button class="qv-ic clear" data-act="qv-clear" data-tip="Unassign Guard" aria-label="Unassign guard"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7z" fill="currentColor" stroke="none"/><path d="M4 7h16M9 7V4h6v3" /></svg></button>
      </div>${list}${hint}
      <div class="qv-r"><b>Break :</b> ${brk}</div>
    </div>
    <div class="qv-f"><button class="qv-link" data-act="qv-full">Full details</button><span class="qv-id">${s.id}</span>
      <span class="qv-fr"><button class="qv-cancel" data-act="qv-cancel">${pending?'Cancel':'Close'}</button><button class="qv-savebtn" data-act="qv-savefull" ${pending?'':'disabled'}>Save Assignment</button></span></div>
  </div>`;
}
function positionQV(){
  const box=document.getElementById('qv-box'); if(!box||!S.qv) return;
  const a=document.querySelector(`.shift[data-id="${S.qv.anchor}"], tr[data-id="${S.qv.anchor}"]`); if(!a) return;
  const r=a.getBoundingClientRect(), w=box.offsetWidth, h=box.offsetHeight, m=8, W=innerWidth, H=innerHeight;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  let left, top;
  if(r.right+m+w <= W-m){ left=r.right+m; top=clamp(r.top, m, H-h-m); }
  else if(r.left-m-w >= m){ left=r.left-m-w; top=clamp(r.top, m, H-h-m); }
  else { left=clamp(r.left, m, W-w-m); top = (r.bottom+m+h <= H-m) ? r.bottom+m : clamp(r.top-m-h, m, H-h-m); }
  box.style.left=left+'px'; box.style.top=top+'px';
}
function renderQV(){ const el=document.getElementById('qv'); if(!el) return; el.innerHTML=qvHTML(); positionQV(); }
function qvCommit(){
  const q=S.qv; if(!q) return; const s=shiftById(q.id); S.qv=null; renderQV();
  if(!s || (q.gid||null)===(s.guardId||null)) return;
  qvApply(s, q.gid);
}
function qvApply(s, gid, keepOpen){
  let msg;
  if(gid){ const ev=qvRank(s).find(e=>e.guard.id===gid); s.guardId=gid; s.status='assigned'; s.published=false; s.ai=!!ev; if(ev) s.aiScore=ev.score;
    msg = guardById(gid).name+' assigned to '+fmtShort(s.date)+' '+s.start+'. Saved as Unpublished.'; }
  else { s.guardId=null; s.status='open'; s.ai=false; s.published=true; msg='Guard unassigned. Shift is now Open.'; }
  S.flash=new Set([s.id]); render(); setTimeout(()=>S.flash.clear(),1700);
  if(keepOpen && S.qv){ S.qv.gid=s.guardId; S.qv.auto=false; S.qv.open=false; S.qv.saved = gid ? '✓ Saved. '+guardById(gid).name+' assigned (Unpublished).' : '✓ Saved. Shift is now Open.'; renderQV(); }
  else toast(msg);
}
Object.assign(A, {
  'qv-toggle': () => { S.qv.open=!S.qv.open; renderQV(); },
  'qv-pick': t => { S.qv.gid=t.dataset.gid||null; S.qv.auto=false; S.qv.open=false; S.qv.saved=null; renderQV(); },
  'qv-assign': t => { const s=shiftById(S.qv.id); qvApply(s, t.dataset.gid, true); },
  'qv-none': () => { const s=shiftById(S.qv.id); if(s.guardId){ qvApply(s, null, true); } else { S.qv.gid=null; S.qv.auto=false; S.qv.open=false; renderQV(); } },
  'qv-save': () => { const q=S.qv, s=shiftById(q.id); if((q.gid||null)===(s.guardId||null)){ toast(q.gid?'This guard is already assigned.':'Select a guard first.','info'); return; } qvApply(s, q.gid, true); },
  'qv-clear': () => { const q=S.qv, s=shiftById(q.id); if(s.guardId){ qvApply(s, null, true); } else { q.gid=null; q.auto=false; q.open=false; renderQV(); } },
  'qv-savefull': () => { const q=S.qv, s=shiftById(q.id); S.qv=null; renderQV(); if((q.gid||null)!==(s.guardId||null)) qvApply(s, q.gid, false); },
  'qv-cancel': () => { S.qv=null; renderQV(); },
  'qv-unpub': () => { const s=shiftById(S.qv.id); s.published=false; render(); renderQV(); toast('Shift unpublished.'); },
  'qv-pub': () => { const s=shiftById(S.qv.id); const iss=validateAssignments([s.id], S.rules); if(iss.length){ S.qv=null; renderQV(); S.modal={type:'pubstale', ids:[s.id], issues:iss}; renderOverlays(); return; } s.published=true; render(); renderQV(); toast('Re-validated and published. Guard notified.'); },
  'qv-full': () => { const id=S.qv.id; S.qv=null; renderQV(); openEdit(id); },
});

renderShell();
render();

</script>
