<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>GuardsPro AI Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: GuardsPro shell (sidebar · topbar · Schedule page) extended with an AI Scheduling workflow layer. Single dark theme, matching the product. */
:root{
  color-scheme:dark;
  --bg:#111a2b; --panel:#182032; --panel-2:#1e2739; --raise:#232d40; --pill:#2a3346; --pill-h:#343e54;
  --line:#2b3446; --line-2:#3a4459; --text:#eef1f6; --muted:#a2aabb; --dim:#727c90;
  --accent:#6f78ff; --accent-2:#5a62ef; --accent-soft:rgba(111,120,255,.15); --on-accent:#ffffff;
  --ok:#3ccf91; --ok-soft:rgba(60,207,145,.13); --warn:#f6b94b; --warn-soft:rgba(246,185,75,.13); --bad:#f2677a; --bad-soft:rgba(242,103,122,.13);
  --today:#4a5367; --card-ink:#18202e; --card-sub:#47506a;
  --c-cyan:#b8ebf7; --c-lilac:#efc6f3; --c-amber:#f7dfae; --c-mint:#c4eed3; --c-peri:#d0d7ff; --c-open:#fcc9c6; --c-unpub:#e2dfdc;
  --bar-pub:#ff9b1c; --bar-open:#ff1f9f; --bar-vac:#ff5a36; --bar-unpub:#8d95a6; --badge:#2f86ea;
  --shadow:0 18px 50px rgba(3,7,18,.55);
  --f-ui:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --f-num:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--text)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.sidebar{width:300px;flex:none;border-right:1px solid var(--line);background:var(--bg);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.logo{display:flex;align-items:center;gap:10px;height:96px;padding:0 30px;font-weight:700;font-size:29px;letter-spacing:-.5px}
.logo svg{width:38px;height:42px}
.nav{display:flex;flex-direction:column;padding:4px 16px 24px;gap:2px}
.nav a{display:flex;align-items:center;gap:22px;height:58px;padding:0 20px;border-radius:8px;font-weight:500;color:var(--text);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel)}
.nav a .ic{width:26px;height:26px;stroke-width:1.5;color:#c9cfdb}
.nav a .chev{margin-left:auto;width:18px;height:18px;color:var(--dim)}
.nav a.open{background:linear-gradient(90deg,#2e3a55,#1b2335);border-left:2px solid var(--accent)}
.nav .sub{display:flex;flex-direction:column;padding:8px 0 8px 68px;gap:4px}
.nav .sub a{height:48px;padding:0;font-size:14px}
.nav .sub a:hover{background:none;color:var(--accent)}
.nav .sub a.on{color:var(--accent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:78px;display:flex;align-items:center;gap:8px;padding:0 24px 0 32px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.topbar .tb{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:#c9cfdb;position:relative}
.topbar .tb:hover{background:var(--panel)}
.topbar .tb .ic{width:26px;height:26px;stroke-width:1.5}
.topbar .spacer{flex:1}
.bell-n{position:absolute;top:4px;right:2px;background:#13a385;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 5px;border:2px solid var(--bg)}
.avatar{width:46px;height:46px;border-radius:50%;background:#d7dbe3;display:grid;place-items:center;margin:0 14px 0 10px;flex:none;overflow:hidden}
.avatar svg{width:46px;height:46px}
.org{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:500;line-height:1.75}
.org-wrap{display:flex;align-items:center;gap:14px}
.page-head{height:90px;display:flex;align-items:center;padding:0 37px;border-bottom:1px solid var(--line);gap:14px}
.page-head h1{font-size:18px;font-weight:700;margin:0}
.crumb{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.crumb .ic{width:16px;height:16px}
.content{padding:24px 25px 120px;min-width:0}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.seg{display:flex;background:var(--panel);border-radius:4px;overflow:hidden}
.seg button{height:50px;padding:0 20px;font-size:16px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--today);color:var(--text)}
.datenav{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:4px}
.datenav > button{height:50px;padding:0 16px;color:var(--text);display:flex;align-items:center;gap:10px;font-size:16px}
.datenav .ttl{color:#c9cfdb;min-width:170px;justify-content:center}
.datenav .today{color:var(--muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.pillbtn{height:46px;min-width:66px;padding:0 20px;border-radius:24px;background:var(--pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px}
.pillbtn:hover{background:var(--pill-h)}
.pillbtn .ic{width:21px;height:21px;stroke-width:2.2}
.pillbtn.ai{background:var(--accent-2);color:var(--on-accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pillbtn.ai:hover,.pillbtn.ai[aria-expanded="true"]{background:var(--accent)}
.pillbtn .cnt{background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.iconbtn{width:40px;height:46px;display:grid;place-items:center;border-radius:6px}
.iconbtn:hover{background:var(--panel)}
.iconbtn .ic{width:24px;height:24px}

/* ---------- banners ---------- */
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:6px;margin-bottom:18px;border:1px solid}
.banner.unpub{background:var(--accent-soft);border-color:rgba(111,120,255,.4)}
.banner.pub{background:var(--ok-soft);border-color:rgba(60,207,145,.4)}
.banner .msg{flex:1;min-width:220px}
.banner .msg b{display:block;font-size:15px}
.banner .msg span{color:var(--muted);font-size:13px}
.banner .ic{width:22px;height:22px}
.chipbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--pill);font-size:13px}
.chip .ic{width:14px;height:14px}

/* ---------- buttons ---------- */
.btn{height:40px;padding:0 18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--accent-2);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent)}
.btn.primary:disabled{background:var(--pill);color:var(--dim);cursor:not-allowed}
.btn.ghost{background:var(--pill)}
.btn.ghost:hover{background:var(--pill-h)}
.btn.outline{box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.outline:hover{background:var(--panel-2)}
.btn.ok{background:#1f9d6c;color:#fff}
.btn.ok:hover{background:#25b27b}
.btn.danger{background:#c6435a;color:#fff}
/* Confirm Action dialog */
.modal.cfa{width:min(700px,100%)}
.cfa-body{display:flex;gap:22px;align-items:flex-start;padding:30px 32px 34px}
.cfa-ic{width:54px;height:54px;border-radius:50%;background:#dc2626;color:#fff;display:grid;place-items:center;flex:none}
.cfa-ic .ic{width:28px;height:28px;stroke-width:2.2}
.cfa-body h3{margin:4px 0 8px;font-size:20px;font-weight:700}
.cfa-body p{margin:0;color:var(--muted);font-size:15px}
.cfa-ft{display:flex;justify-content:flex-end;gap:14px;padding:20px 28px;background:rgba(0,0,0,.12);border-top:1px solid var(--line)}
.btn.cfa-cancel{background:transparent;color:#8b9cf4;box-shadow:inset 0 0 0 1px #5b6478;height:50px;padding:0 18px;font-weight:600;border-radius:5px}
.btn.cfa-cancel:hover{background:var(--panel-2)}
.btn.cfa-ok{background:#a9c7fb;color:#13203b;height:50px;padding:0 26px;font-size:16px;border-radius:5px}
.btn.cfa-ok:hover{background:#bdd4fc}
.link{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}
.link .ic{width:16px;height:16px}

/* ---------- calendar ---------- */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
.cal{min-width:980px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dh{height:80px;display:grid;place-items:center;font-size:20px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .cell{min-height:150px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 8px 12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.cal .dh:nth-child(7n),.cal .cell:nth-child(7n){border-right:0}
.cal .cell.today{background:var(--today)}
.cal .cell.out .dnum{color:var(--dim)}
.cal.week .cell{min-height:420px}
.dnum{align-self:flex-end;font-weight:700;font-size:17px;margin:-4px 0 2px}
.dnum.btnlike{cursor:pointer}

.shift{position:relative;min-height:38px;border-radius:3px;background:var(--c-cyan);color:var(--card-ink);display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;cursor:pointer;font-size:13px;border-left:6px solid var(--bar-pub);transition:box-shadow .15s, opacity .15s, transform .15s}
.shift.s-cyan{background:var(--c-cyan)} .shift.s-lilac{background:var(--c-lilac)} .shift.s-amber{background:var(--c-amber)} .shift.s-mint{background:var(--c-mint)} .shift.s-peri{background:var(--c-peri)}
.shift.open{background:var(--c-open);border-left-color:var(--bar-open)}
.shift.vacant{background:var(--c-open);border-left-color:var(--bar-vac)}
.shift.unpub{background:var(--c-unpub);border-left-color:var(--bar-unpub)}
.shift .hc{position:absolute;left:-8px;top:-7px;background:var(--badge);color:#fff;font-size:10px;font-weight:700;min-width:13px;height:16px;border-radius:3px;display:grid;place-items:center;padding:0 2px}
.shift .body{flex:1;min-width:0;display:flex;flex-direction:column}
.shift .lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;word-break:break-word}
.shift .lbl b{white-space:nowrap}
.shift .lbl b{font-weight:500}
.shift .sub{font-size:12px;color:var(--card-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:1px 6px;border-radius:3px;line-height:15px}
.tag.unpub{background:#4b5264;color:#fff}
.tag.pub{background:#17845a;color:#fff}
.tag.ai{background:rgba(24,32,46,.12);color:var(--card-ink)}
.shift .kebab{width:22px;height:28px;display:grid;place-items:center;color:#5b6378;border-radius:3px;flex:none}
.shift .kebab:hover{background:rgba(0,0,0,.08)}
.shift .kebab .ic{width:18px;height:18px}
.shift .pick{width:28px;align-self:stretch;margin:-4px -4px -4px 0;background:#f58a96;display:grid;place-items:center;border-radius:0 3px 3px 0;flex:none}
.shift .pick i{width:19px;height:19px;border-radius:50%;border:2px solid #3237c9;display:grid;place-items:center}
.shift.selected .pick i::after{content:"";width:9px;height:9px;border-radius:50%;background:#3237c9}
.shift.confirmed .lbl::after{content:" \2713";font-weight:700;color:#178a5a}
/* AI select mode */
.mode-ai .shift.locked{opacity:.32;cursor:not-allowed;filter:saturate(.4)}
.mode-ai .shift.selectable{box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(111,120,255,.55)}
.mode-ai .shift.selectable:hover{transform:translateY(-1px)}
.shift.selected{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent),0 6px 18px rgba(111,120,255,.35)!important}
.mode-ai .shift.selected .pick{background:var(--accent)}
.mode-ai .shift.selected .pick i{border-color:#fff}
.mode-ai .shift.selected .pick i::after{background:#fff}
.mode-ai .shift.selectable .pick{background:#c9cdfb}
.shift.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--bg),0 0 0 6px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* day + list views */
.daylist{background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.daylist h3{margin:0 0 6px;font-size:18px}
.daylist .shift{min-height:52px;font-size:15px}
.empty{color:var(--muted);padding:24px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table.grid{width:100%;border-collapse:collapse;min-width:860px}
table.grid th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
table.grid td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:var(--raise)}
table.grid tr.selected td{background:var(--accent-soft)}
.mode-ai table.grid tr.locked td{opacity:.35}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st .ic{width:14px;height:14px;stroke-width:2.2}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.info{background:var(--accent-soft);color:#a9afff}
.st.muted{background:var(--pill);color:var(--muted)}

/* ---------- bottom bars ---------- */
.bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;background:#1b2232;border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:4px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 18px;width:min(1060px,calc(100% - 32px))}
.bbar .count{font-size:17px;font-weight:500}
.bbar .count small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.bbar .acts{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.bbar .acts .link{font-size:16px;font-weight:400}
.bbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bbar.ai{border-color:rgba(111,120,255,.6)}
.bbar .aihint{display:flex;align-items:center;gap:8px;color:#b6bbff;font-size:13px}
.bbar .aihint .ic{width:18px;height:18px}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:60;background:#1c2332;border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);min-width:240px;padding:6px 0}
.menu .mh{padding:10px 18px 10px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;gap:12px}
.menu button.mi{width:100%;display:flex;align-items:center;gap:16px;padding:0 20px;min-height:58px;font-size:16px;text-align:left;border-bottom:1px solid var(--line)}
.menu button.mi:last-child{border-bottom:0}
.menu button.mi:hover{background:var(--raise)}
.menu button.mi .ic{width:24px;height:24px;color:#d4d8e2}
.menu button.mi .t{display:flex;flex-direction:column;flex:1}
.menu button.mi .t small{color:var(--muted);font-size:12.5px}
.menu button.mi .chev{width:16px;height:16px;margin-left:auto}
.menu.ai-menu{width:330px}
.menu.ai-menu .mi .ic{color:#b6bbff}
.menu .subm{background:var(--panel-2)}
.menu .subm .mi{min-height:44px;padding-left:60px;font-size:14.5px}
.pop{position:fixed;z-index:60;background:#1c2332;border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);width:300px;padding:16px 18px}
.pop h4{margin:0 0 12px;font-size:14px}
.pop .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pop .kv:last-child{border-bottom:0}
.pop .kv span:first-child{color:var(--muted)}

/* ---------- modal + drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,9,18,.62);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal.sm{width:min(460px,100%)}
.modal.scope-modal{width:min(500px,100%)}
.cf-main{flex:1;min-width:0}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.scope-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:7px;cursor:pointer;background:var(--bg);transition:border-color .15s,background-color .15s}
.scope-opt:hover{border-color:#4a5672}
.scope-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.scope-opt input{margin:2px 0 0;accent-color:var(--accent);width:15px;height:15px;flex:none}
.scope-opt b{display:block;font-size:13.5px;font-weight:500}
.scope-opt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.scope-range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.scope-range.hide{display:none}
.scope-range label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.scope-range .field{height:38px;width:100%;min-width:0;box-sizing:border-box}
.scope-modal,.scope-modal *{box-sizing:border-box}
@media (max-width:560px){.scope,.scope-range{grid-template-columns:1fr}}
.confirm-ai{display:flex;gap:16px;align-items:flex-start;padding:24px 24px 20px}
.confirm-ai h3{margin:0 0 6px;font-size:18px}
.confirm-ai p{margin:0;color:var(--text);font-size:14.5px}
.confirm-ai small{color:var(--muted);font-size:12.5px}
.confirm-ai .eyebrow{margin-bottom:6px}
.cf-badge{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:#b6bbff;display:grid;place-items:center;flex:none}
.cf-badge .ic{width:22px;height:22px}
.confirm-ai .cf-ic{width:24px;height:24px;color:var(--muted);margin-top:2px}
.modal .mhd{padding:20px 24px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.modal .mhd h3{margin:0;font-size:18px}
.modal .mhd p{margin:4px 0 0;color:var(--muted);font-size:13px}
.modal .mhd .x{margin-left:auto}
.eyebrow{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:#a9afff;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.eyebrow .ic{width:14px;height:14px}
.modal .mbd{padding:20px 24px;overflow-y:auto}
.modal .mft{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .mft .left{margin-right:auto}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--raise);color:var(--text)}
.bigcount{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.bigcount b{font-size:40px;font-weight:700;line-height:1}
.bigcount span{color:var(--muted)}
.splits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.split{border-radius:6px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:500}
.split .ic{width:20px;height:20px;stroke-width:2.2}
.split.ok{background:var(--ok-soft);color:var(--ok)}
.split.warn{background:var(--warn-soft);color:var(--warn)}
.split b{font-size:20px}
.minilist{border:1px solid var(--line);border-radius:6px;max-height:280px;overflow-y:auto}
.minilist .r{display:grid;grid-template-columns:96px 104px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.minilist .r:last-child{border-bottom:0}
.minilist .r .m{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rulesum{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;background:var(--panel-2);border-radius:6px;font-size:13px;flex-wrap:wrap}
.rulesum .ic{width:20px;height:20px;color:#b6bbff}
.rulesum div{flex:1;min-width:180px}
.rulesum small{display:block;color:var(--muted)}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.note .ic{width:16px;height:16px;margin-top:1px}

.steps{display:flex;flex-direction:column;gap:12px;margin:8px 0 4px}
.step{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:14.5px}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);flex:none}
.step.done{color:var(--text)}
.step.done i{background:var(--ok);border-color:var(--ok);color:#0d2a1e}
.step.done i .ic{width:14px;height:14px;stroke-width:3}
.step.now{color:var(--text)}
.step.now i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:18px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:6px auto 16px}
.center{text-align:center}
.success-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:4px auto 14px}
.success-ic .ic{width:30px;height:30px;stroke-width:2.6}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sumgrid .t{background:var(--panel-2);border-radius:6px;padding:12px 14px}
.sumgrid .t b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.sumgrid .t span{font-size:12.5px;color:var(--muted)}
.sumgrid .t.ok b{color:var(--ok)} .sumgrid .t.warn b{color:var(--warn)} .sumgrid .t.bad b{color:var(--bad)}
.confirm-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.confirm-list div{display:flex;align-items:center;gap:10px}
.confirm-list .ic{width:18px;height:18px}
.callout{background:var(--accent-soft);border:1px solid rgba(111,120,255,.35);border-radius:6px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.callout .ic{width:18px;height:18px;color:#b6bbff;margin-top:1px}
.callout.warn{background:var(--warn-soft);border-color:rgba(246,185,75,.4)}
.callout.warn .ic{color:var(--warn)}

.drawer-scrim{position:fixed;inset:0;background:rgba(5,9,18,.55);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line-2);box-shadow:var(--shadow);z-index:81;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dhd{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dhd h3{margin:0;font-size:19px}
.drawer .dhd p{margin:4px 0 0;color:var(--muted);font-size:13px}
.drawer .dbd{flex:1;overflow-y:auto;padding:8px 24px 24px}
.drawer .dft{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.drawer .dft .right{margin-left:auto;display:flex;gap:10px}
.sec{margin-top:20px}
.sec h4{margin:0 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sec > p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.rule{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rule .rt{flex:1;min-width:0}
.rule .rt b{font-weight:500;display:block}
.rule .rt small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.rule .ctl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rule.off .rt b{color:var(--dim)}
.rule .wt{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.switch{position:relative;width:38px;height:22px;flex:none;margin-top:1px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--line-2);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + span{background:var(--accent-2)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.field{background:var(--bg);border:1px solid var(--line-2);border-radius:4px;height:34px;padding:0 10px}
.field.n{width:72px}
select.field{padding-right:8px}
.equal{display:flex;gap:10px;background:var(--accent-soft);border:1px solid rgba(111,120,255,.35);border-radius:6px;padding:12px 14px;font-size:13.5px;margin:6px 0 4px}
.equal .ic{color:#b6bbff;width:18px;height:18px;margin-top:1px}
.example{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:12px;font-size:13px}
.example code{font-family:var(--f-num);font-size:12.5px;color:#cfd3ff;word-break:break-word}
.cb{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.cb input{width:17px;height:17px;accent-color:var(--accent)}

/* ---------- results ---------- */
.res-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.res-head h2{margin:0;font-size:22px}
.res-head p{margin:6px 0 0;color:var(--muted);max-width:640px}
.res-head .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.principle{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:#c3c7ff;border-radius:14px;padding:4px 12px;font-size:12.5px;font-weight:500;margin-top:10px}
.principle .ic{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.stats .t{background:var(--panel);padding:14px 16px}
.stats .t b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stats .t span{color:var(--muted);font-size:12.5px}
.stats .t.ok b{color:var(--ok)} .stats .t.warn b{color:var(--warn)} .stats .t.bad b{color:var(--bad)} .stats .t.info b{color:#a9afff}
.optnote{margin-bottom:16px}
table.res{width:100%;border-collapse:collapse;min-width:980px}
table.res th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
table.res td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.res tr.row{cursor:pointer}
table.res tr.row:hover td{background:var(--raise)}
table.res tr.row.exp td{background:var(--raise);border-bottom-color:transparent}
table.res tr.detail > td{background:#151d2d;padding:0;border-bottom:1px solid var(--line-2)}
.caret{width:18px;height:18px;transition:transform .15s;color:var(--muted)}
tr.exp .caret{transform:rotate(90deg)}
.cell-shift b{display:block;font-weight:500;white-space:nowrap}
.cell-shift{min-width:170px}
.cell-shift span,.cell-site span{color:var(--muted);font-size:12.5px}
.cell-site b{display:block;font-weight:500}
.qchips{display:flex;gap:4px;flex-wrap:wrap}
.q{font-size:11.5px;padding:2px 7px;border-radius:3px;background:var(--pill);color:#cfd4df;white-space:nowrap}
.q.pref{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.gcell{display:flex;align-items:center;gap:10px;min-width:0}
.gcell .gt{min-width:0}
.gcell b{font-weight:500;display:block;white-space:nowrap}
.gcell small{color:var(--muted);font-size:12px;display:block;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0f1626;flex:none}
.star{color:#ffcc4d}
.star .ic{width:15px;height:15px;vertical-align:-2px}
.score{display:flex;align-items:center;gap:10px;min-width:120px}
.score b{font-variant-numeric:tabular-nums;min-width:38px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:50px}
.bar span{display:block;height:100%;border-radius:3px}
.hi{background:var(--ok)} .mid{background:var(--accent)} .lo{background:var(--warn)} .zero{background:var(--bad)}

.detail-grid{display:grid;grid-template-columns:minmax(300px,0.9fr) minmax(0,1.3fr);gap:0}
.dpane{padding:20px 22px;min-width:0}
.dpane + .dpane{border-left:1px solid var(--line)}
.dpane h5{margin:0 0 10px;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.dpane h5 .ic{width:14px;height:14px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--line-2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.focus{box-shadow:inset 3px 0 0 var(--accent)}
.opt.dis{opacity:.55;cursor:not-allowed}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--accent)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.opt .ot{flex:1;min-width:0}
.opt .ot b{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opt .ot small{display:block;color:var(--muted);font-size:12px}
.opt .ot small.bad{color:var(--bad)}
.opt .os{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.opt .why{font-size:12px;color:var(--accent);padding:4px 6px;border-radius:4px}
.opt .why:hover{background:var(--accent-soft)}
.opt .wi{color:var(--warn);display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500}
.opt .wi .ic{width:14px;height:14px}
.subhead{font-size:12px;color:var(--muted);margin:16px 0 8px;display:flex;justify-content:space-between}
.mini-tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:3px;padding:1px 6px}
.mini-tag.ai{background:rgba(255,204,77,.16);color:#ffd36b}
.mini-tag.man{background:var(--accent-soft);color:#b9beff}
.excl{margin-top:14px}
.excl table{width:100%;border-collapse:collapse;font-size:12.5px}
.excl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.excl td:first-child{white-space:nowrap;padding-right:10px;font-weight:500}
.x-reason{color:var(--bad);display:block}
.why-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.why-head .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.why-head .nm{font-size:17px;font-weight:500}
.why-head .actions{margin-left:auto}
.factors{width:100%;border-collapse:collapse}
.factors td{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.factors td.fl{width:36%;padding-right:10px}
.factors td.fl b{font-weight:500;display:block}
.factors td.fl small{color:var(--muted);font-size:11.5px}
.factors td.fb{padding-right:12px}
.factors td.fv{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.factors tr.off td{opacity:.4}
.factors tr.total td{border-bottom:0;padding-top:10px;font-size:14px}
.calc{font-family:var(--f-num);font-size:12px;color:#cfd3ff;background:var(--bg);border-radius:4px;padding:8px 10px;margin-top:8px;word-break:break-word}
.explain{margin:14px 0 0;font-size:13.5px;line-height:1.55;max-width:70ch}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.lists ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lists li{display:flex;gap:8px;align-items:flex-start}
.lists li .ic{width:15px;height:15px;margin-top:2px;stroke-width:2.4}
.okc{color:var(--ok)} .wc{color:var(--warn)} .bc{color:var(--bad)}
.noelig{display:flex;gap:16px;padding:20px 22px;flex-wrap:wrap}
.noelig .card{flex:1;min-width:280px;border:1px solid rgba(246,185,75,.45);background:var(--warn-soft);border-radius:8px;padding:16px 18px}
.noelig .card h4{margin:0 0 6px;color:var(--warn);display:flex;align-items:center;gap:8px;font-size:16px}
.noelig .card h4 .ic{width:20px;height:20px}
.noelig .card .when{font-size:13.5px;margin-bottom:10px}
.noelig ul{margin:8px 0 12px;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.noelig .side{flex:1;min-width:280px}
.optimiz{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#c3c7ff;background:var(--accent-soft);border-radius:6px;padding:10px 12px;margin-top:12px}
.optimiz .ic{width:16px;height:16px;margin-top:1px}
.rowflag{display:inline-flex;align-items:center;gap:4px;color:#b6bbff;font-size:11.5px;margin-top:3px}
.rowflag .ic{width:12px;height:12px}

/* history drawer */
.gp-head{display:flex;gap:14px;align-items:center}
.gp-head .av{width:52px;height:52px;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.kpis div{background:var(--panel-2);border-radius:6px;padding:10px 12px}
.kpis b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpis span{font-size:11.5px;color:var(--muted)}
.availrow{display:flex;gap:6px;margin-top:6px}
.availrow span{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:500;background:var(--panel-2);color:var(--dim)}
.availrow span.A{background:var(--ok-soft);color:var(--ok)}
.availrow span.C{background:var(--warn-soft);color:var(--warn)}
.kv2{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv2 span:nth-child(odd){color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
table.hist th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
table.hist td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}

/* edit modal */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form .field{height:40px;width:100%}
.form .ro{height:40px;display:flex;align-items:center;color:var(--text);font-size:14px}
.elig{margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.elig ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
.elig li{display:flex;gap:6px;align-items:flex-start}
.elig li .ic{width:14px;height:14px;margin-top:2px;stroke-width:2.4}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{background:#0b111d;border:1px solid var(--line-2);color:var(--text);border-radius:6px;padding:11px 16px;box-shadow:var(--shadow);font-size:14px;display:flex;gap:10px;align-items:center;max-width:520px}
.toast .ic{width:18px;height:18px;color:var(--ok)}

.mob-only{display:none}
.rm-wrap{position:fixed;inset:0;z-index:81;display:grid;place-items:center;padding:32px 16px;pointer-events:none}
.rmodal{pointer-events:auto;width:100%;max-width:850px;max-height:calc(100vh - 64px);display:flex;flex-direction:column;background:#1E293B;border:1px solid #334155;border-radius:10px;box-shadow:var(--shadow);font-size:13px;overflow:hidden}
.rmodal .dhd{padding:14px 18px 12px;border-bottom:1px solid #334155;display:flex;gap:10px;align-items:flex-start;flex:none}
.rmodal .dhd h3{margin:0;font-size:16px}
.rmodal .dhd p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.rmodal .eyebrow{font-size:10.5px;margin-bottom:2px}
.rmodal .x{width:30px;height:30px}
.rmodal .dbd{flex:1;overflow-y:auto;padding:4px 18px 16px;scroll-behavior:smooth;overscroll-behavior:contain}
.rmodal .dft{flex:none;padding:10px 18px;border-top:1px solid #334155;display:flex;gap:8px;background:#1E293B}
.rmodal .dft .right{margin-left:auto;display:flex;gap:8px}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;gap:6px;border-radius:5px}
.btn.sm .ic{width:15px;height:15px}
.rmodal .sec{margin-top:14px}
.rmodal .sec h4{font-size:11px;margin:0 0 2px}
.rmodal .sec > p,.rmodal .sf-head p{font-size:12px;margin:0 0 6px}
.rmodal .rule{padding:7px 0;gap:10px}
.rmodal .rule .rt b{font-size:13px}
.rmodal .rule .rt small{font-size:11.5px;line-height:1.35}
.rmodal .rule .ctl{margin-top:5px;font-size:12px;gap:6px}
.rmodal .field{height:28px;font-size:12.5px;padding:0 8px;background:#0F172A;border-color:#334155}
.rmodal .field.n{width:58px}
.rmodal .switch{width:32px;height:18px}
.rmodal .switch span{border-radius:9px}
.rmodal .switch span::after{width:12px;height:12px}
.rmodal .switch input:checked + span::after{transform:translateX(14px)}
.rmodal .hr-grid{column-gap:20px}
.rmodal .sf-head{margin-bottom:8px;gap:10px;align-items:center}
.rmodal .sf-split{grid-template-columns:340px minmax(0,1fr);gap:14px}
.rmodal .radar-card{padding:10px;background:#0F172A;border-color:#334155}
.rmodal .rd-lbl{font-size:17px}
.rmodal .dhd > div:first-child{flex:1}
.rmodal .rd-val{font-size:12px}
.rmodal .rd-scale{font-size:11px}
.rmodal .radar-sum{font-size:11.5px;gap:10px;padding-top:6px}
.rmodal .radar-card .example{font-size:11.5px;padding:8px 10px;margin-top:8px;background:#1E293B;border-color:#334155}
.rmodal .example code{font-size:10.5px}
.rmodal .example .note{font-size:11px;margin-top:4px}
.rmodal .frow{gap:8px;padding:6px 4px;grid-template-columns:auto minmax(0,1fr) auto auto}
.rmodal .frow .rt b{font-size:13px}
.rmodal .frow .rt small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rmodal .stepper button{width:24px;height:26px;font-size:15px}
.rmodal .stepper input{width:30px;height:26px;font-size:12.5px;background:transparent}
.rmodal .stepper{background:#0F172A;border-color:#334155}
.rmodal .wctl{gap:6px}
.rmodal .pct{min-width:42px;font-size:12px}
.rmodal .fr-acts .x.sm{width:22px;height:22px}
.rmodal .fr-acts .x.sm .ic{width:14px;height:14px}
.rmodal .ctag{font-size:9.5px}
.rmodal .admin-tag{font-size:9px}
.rmodal .addform{padding:10px 12px;margin-bottom:8px}

function addDays(ds, n){ const t = parseDate(ds)+n*DAY; return isoDate(t); }
function isoDate(t){ const d=new Date(t); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); }
function dow(ds){ return new Date(parseDate(ds)).getUTCDay(); }

function emptyReq(){ return {skills:[], licenses:[], certifications:[], payMin:null, payMax:null, minExp:null, maxDist:null, noOverride:[]}; }
const SITE_REQ = {
  ABC: { skills:[{name:'Access Control',level:'required'},{name:'CCTV Monitoring',level:'preferred'}], licenses:['Security Guard License'], certifications:[], payMin:18, payMax:25, minExp:1, maxDist:15, noOverride:['license:Security Guard License'], updatedAt:'2026-09-30', updatedBy:'Kapil' },
  RMP: { skills:[{name:'Emergency Response',level:'required'},{name:'De-escalation',level:'preferred'}], licenses:['Security Guard License'], certifications:['First Aid','CPR'], payMin:20, payMax:30, minExp:2, maxDist:20, noOverride:['license:Security Guard License','cert:CPR'], updatedAt:'2026-09-30', updatedBy:'Kapil' },
  HLW: { skills:[{name:'Vehicle Inspection',level:'required'}], licenses:['Security Guard License','Driver License'], certifications:[], payMin:null, payMax:null, minExp:1, maxDist:25, noOverride:['license:Security Guard License'], updatedAt:'2026-09-30', updatedBy:'Kapil' },

function siteReq(siteId){ return SITE_REQ[siteId] || null; }
function hasReq(r){ return !!r && (r.skills.length||r.licenses.length||r.certifications.length||r.payMin!=null||r.payMax!=null||r.minExp!=null||r.maxDist!=null); }
function payText(r){ return r.payMin!=null&&r.payMax!=null ? '$'+r.payMin+'–$'+r.payMax+'/hr' : r.payMin!=null ? 'at least $'+r.payMin+'/hr' : 'up to $'+r.payMax+'/hr'; }
/* Check one guard against a site's requirements. Independent of any shift, so the

function canOverride(r, key){ return !(r.noOverride||[]).includes(key); }
/* Standing overrides approved on the Post Site screen: SITE_EXEMPT[siteId][guardId] =

function checkReq(g, siteId, r){

  if(!hasReq(r)) return {configured:false, items, fails, exempt, met:0, total:0, partial:false, hard:[], soft:[]};
  const ex = exemptFor(siteId, g.id);

  const miss = (key, cat, blockLabel, detail, req, status) => {
    const f = {key:'psr:'+key, cat, label:'Post site: '+req, blockLabel, detail, req, status, overridable:canOverride(r,key)};
    if(ex && f.overridable && ex.keys.includes(key)){ exempt.push(f); return true; }

  const req = r.skills.filter(x=>x.level==='required').map(x=>x.name), pref = r.skills.filter(x=>x.level==='preferred').map(x=>x.name);

    const waived = !ok && miss('exp', 'Experience', 'Experience below minimum', d, 'Minimum '+r.minExp+' year'+(r.minExp===1?'':'s')+' experience', 'Has '+yrs);

    const waived = !ok && miss('dist', 'Distance', 'Outside travel distance', d, 'Within '+r.maxDist+' miles of the site', dd+' miles away');
    item('Distance', !ok && !waived, waived, d, d); }

    const waived = !ok && miss('pay', 'Pay rate', 'Pay rate outside range', d, 'Pay rate '+payText(r), '$'+g.rate+'/hr');

/* Plain-language sentence for a guard's requirement conflicts, e.g.
   "John Smith is missing the required First Aid certification for this post site." */
function conflictSentence(name, fails){
  const miss = fails.filter(f=>f.status==='Missing').map(f=>f.req), other = fails.filter(f=>f.status!=='Missing');
  const parts = [];
  if(miss.length) parts.push('is missing the required '+joinList(miss));
  other.forEach(f=>parts.push(f.cat==='Experience' ? 'has '+f.status.replace('Has ','')+' of experience (needs '+f.req.replace('Minimum ','').replace(' experience','')+')'
    : f.cat==='Distance' ? 'lives '+f.status+' (limit '+f.req.replace('Within ','').replace(' of the site','')+')'
    : 'has a pay rate of '+f.status+' (site range '+f.req.replace('Pay rate ','')+')'));
  return name+' '+joinList(parts)+' for this post site.';
}
/* Condition templates an admin can build a custom hard rule from (pass/fail) */
const HARD_TEMPLATES = {
  minRating:     { label:'Minimum guard rating', kind:'num', unit:'out of 5', def:4.5, min:1, max:5, step:0.1, verb:'rating is below', test:(g,sh,v)=>g.rating>=v, detail:(g,sh,v)=>'Rating '+g.rating+' (min '+v+')' },
  maxDistance:   { label:'Maximum travel distance', kind:'num', unit:'miles', def:10, min:1, max:60, step:1, verb:'lives more than', test:(g,sh,v)=>distTo(g,sh.site)<=v, detail:(g,sh,v)=>distTo(g,sh.site)+' mi from site (max '+v+')' },
  minYears:      { label:'Minimum years of service', kind:'num', unit:'years', def:3, min:0, max:30, step:1, verb:'has fewer than', test:(g,sh,v)=>g.years>=v, detail:(g,sh,v)=>g.years+' years of service (min '+v+')' },
  minAttendance: { label:'Minimum attendance rate', kind:'num', unit:'%', def:93, min:50, max:100, step:1, verb:'attendance is below', test:(g,sh,v)=>g.att>=v, detail:(g,sh,v)=>g.att+'% attendance (min '+v+'%)' },
  maxRate:       { label:'Maximum hourly pay rate', kind:'num', unit:'$/hr', def:24, min:10, max:60, step:1, verb:'pay rate is above', test:(g,sh,v)=>g.rate<=v, detail:(g,sh,v)=>'$'+g.rate+'/hr (max $'+v+')' },
  reqSkill:      { label:'Must hold skill', kind:'select', unit:'', def:'Access Control', options:ALL_SKILLS, verb:'does not hold', test:(g,sh,v)=>g.skills.includes(v), detail:(g,sh,v)=>g.skills.includes(v)?'Holds '+v:'Missing '+v },

function defaultRules(){
  return {
    hard: { active:true, available:true, qualification:true, department:true, conflict:true, site:true, maxHours:true },
    maxHoursCap: 48,
    conflictBuffer: 'travel', // 'none' | 'travel'
    factors: FACTORS.map(f=>({...f, on:true, weight:10})),
    customHard: [],
    travelWarn: 12,
    restWarn: 8,
  };
}
function activeFactors(rules){ return rules.factors.filter(f=>f.on && f.weight>0); }
function factorPct(rules, key){ const act=activeFactors(rules); const tot=act.reduce((t,f)=>t+f.weight,0); const f=act.find(x=>x.key===key); return f&&tot? f.weight/tot*100 : 0; }

/* ===================== ENGINE ===================== */
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function range(sh){ const b=parseDate(sh.date); const s=b+toMin(sh.start)*60000; let e=b+toMin(sh.end)*60000; if(e<=s) e+=DAY; return [s,e]; }
function shHours(sh){ const [s,e]=range(sh); return (e-s)/3600000; }
function shiftType(sh){ const h=toMin(sh.start)/60; if(h>=4 && h<14) return 'Day'; if(h>=14 && h<20) return 'Evening'; return 'Overnight'; }
function weekOf(ms){ const day=ms-(ms%DAY); const dw=(new Date(day).getUTCDay()+6)%7; return day-dw*DAY; }
function r1(n){ return Math.round(n*10)/10; }
function guardById(id){ return GUARDS.find(g=>g.id===id); }
function shiftById(id){ return SHIFTS.find(s=>s.id===id); }
function hasQual(g,q){ return g.quals.includes(q) || (q==='Unarmed Guard' && g.quals.includes('Armed Guard')); }
function distTo(g, siteId){ const s=SITES[siteId]; return r1(Math.hypot(g.hx-s.x, g.hy-s.y)); }
function siteDist(a,b){ const A=SITES[a],B=SITES[b]; return r1(Math.hypot(A.x-B.x, A.y-B.y)); }
const DOWN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(ds){ const d=new Date(parseDate(ds)); return MON[d.getUTCMonth()]+' '+d.getUTCDate(); }
function fmtDay(ds){ const d=new Date(parseDate(ds)); return DOWN[d.getUTCDay()].slice(0,3)+', '+MON[d.getUTCMonth()]+' '+d.getUTCDate(); }

/* Base assignment list = every assigned shift currently on the schedule */
function baseAssignments(excludeIds){
  const ex = new Set(excludeIds||[]);
  return SHIFTS.filter(s=>s.status==='assigned' && s.guardId && !ex.has(s.id)).map(s=>({shift:s, guardId:s.guardId, source:'schedule'}));
}

function weekHours(g, wk, list, excludeId){
  let h = g.extraHours;
  list.forEach(a=>{ if(a.guardId===g.id && a.shift.id!==excludeId && weekOf(range(a.shift)[0])===wk) h+=shHours(a.shift); });
  return h;
}

function hm(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h? (h+'h'+(m? ' '+m+'m':'')) : m+'m'; }

function evaluate(g, sh, list, rules){
  const H = rules.hard;
  const site = SITES[sh.site];
  const st = shiftType(sh);
  const [s,e] = range(sh);
  const w = dow(sh.date);
  const checks = [];
  const add = (key,label,pass,detail,blockLabel)=>checks.push({key,label,pass,detail,on:!!H[key],blockLabel});

  add('active','Guard must be Active', g.status==='Active', g.status==='Active'?'Active':'Inactive — '+(g.statusNote||'not active'), 'Guard inactive');

  const code = g.avail[w];
  let avPass=true, avDetail;
  if(g.timeOff.includes(sh.date)){ avPass=false; avDetail='Approved time off on '+fmtShort(sh.date); }
  else if(code==='-'){ avPass=false; avDetail='Not available on '+DOWN[w]+'s'; }
  else if(!g.shiftTypes.includes(st)){ avPass=false; avDetail='Does not work '+st+' shifts'; }
  else avDetail = code==='C' ? 'On-call only on '+DOWN[w]+'s' : 'Available '+DOWN[w]+' '+st;
  add('available','Guard must be Available', avPass, avDetail, 'Guard unavailable');

  const missing = sh.req.filter(q=>!hasQual(g,q));
  add('qualification','Required Qualification', missing.length===0, missing.length? 'Missing '+missing.join(', ') : 'Holds '+sh.req.join(', '), 'Qualification mismatch');

  const deptHome = g.dept===sh.dept, deptCross = g.cross.includes(sh.dept);
  add('department','Required Department', deptHome||deptCross, deptHome? sh.dept : deptCross? 'Cross-trained for '+sh.dept : g.dept+' (needs '+sh.dept+')', 'Department mismatch');

  // conflicts
  const mine = list.filter(a=>a.guardId===g.id && a.shift.id!==sh.id);
  let conflict=null, minRest=Infinity, restWith=null;
  for(const a of mine){
    const [as,ae] = range(a.shift);
    if(as<e && ae>s){ conflict = {type:'overlap', with:a}; break; }
    let gap, from, to;
    if(ae<=s){ gap=(s-ae)/60000; from=a.shift.site; to=sh.site; } else { gap=(as-e)/60000; from=sh.site; to=a.shift.site; }
    if(rules.conflictBuffer==='travel' && from!==to){
      const need = siteDist(from,to)/30*60 + 15;
      if(gap < need){ conflict={type:'travel', with:a, gap, need}; break; }
    }
    if(gap<minRest){ minRest=gap; restWith=a; }
  }
  let cDetail = 'No overlapping shifts';
  if(conflict){
    const o=conflict.with.shift, tag = conflict.with.source==='batch' ? ' (recommended in this run)' : '';
    cDetail = conflict.type==='overlap'
      ? 'Booked '+fmtShort(o.date)+' '+o.start+'–'+o.end+' at '+SITES[o.site].name+tag
      : 'Only '+hm(conflict.gap)+' to travel from '+SITES[conflict.with.shift.site===sh.site?sh.site:conflict.with.shift.site].name+' ('+siteDist(o.site,sh.site)+' mi)'+tag;
  }
  add('conflict','No Schedule Conflict', !conflict, cDetail, conflict&&conflict.type==='travel'?'Impossible travel':'Schedule conflict');
  if(conflict) checks[checks.length-1].withId = conflict.with.shift.id;

  const siteOk = !site.restricted || g.cleared.includes(sh.site);
  add('site','Site/Post Eligibility', siteOk, siteOk ? (site.restricted?'Cleared for '+site.name:'No site clearance needed') : 'Not cleared for '+site.name, 'Not cleared for site');

  const wk = weekOf(s);
  const before = weekHours(g, wk, list, sh.id);
  const projected = before + shHours(sh);
  add('maxHours','Maximum Weekly Hours', projected<=rules.maxHoursCap, projected+'h projected (limit '+rules.maxHoursCap+'h)', 'Weekly hour limit exceeded');

  (rules.customHard||[]).forEach(c=>{
    if(c.site!=='all' && c.site!==sh.site) return;
    const T = HARD_TEMPLATES[c.cond]; if(!T) return;
    checks.push({key:c.key, label:c.label, pass:T.test(g,sh,c.value), detail:T.detail(g,sh,c.value), on:!!c.on, blockLabel:c.label, custom:true});
  });
  // ---- post site requirements (mandatory parts block, always on) ----
  const reqMatch = checkReq(g, sh.site);
  reqMatch.fails.forEach(x=>checks.push({key:x.key, label:x.label, pass:false, detail:x.detail, on:true, blockLabel:x.blockLabel, psr:true, overridable:x.overridable, req:x.req, status:x.status}));
  const eligible = checks.every(c=>!c.on || c.pass);
  const blocking = checks.filter(c=>c.on && !c.pass).sort((a,b)=>(b.psr?1:0)-(a.psr?1:0));

  // ---- factor scores ----
  const d = distTo(g, sh.site);
  const f = {};
  const det = {};
  f.availability = !avPass ? 0 : code==='C' ? 70 : 100;
  det.availability = avDetail;
  const reqMet = sh.req.length - missing.length;
  const prefMet = sh.pref.filter(q=>hasQual(g,q)).length;
  if(missing.length) f.qualification = Math.round(70*reqMet/sh.req.length);
  else if(sh.pref.length) f.qualification = 70 + Math.round(30*prefMet/sh.pref.length);
  else f.qualification = 100;
  det.qualification = missing.length ? 'Missing '+missing.join(', ') : (sh.pref.length ? (prefMet? 'Required + preferred ('+sh.pref.join(', ')+')' : 'Required only; lacks preferred '+sh.pref.join(', ')) : 'All required certifications');
  f.department = deptHome?100 : deptCross?75 : 0;
  det.department = deptHome?'Home department' : deptCross?'Cross-trained':'Other department';
  f.travel = Math.max(0, Math.min(100, Math.round(100 - Math.max(0,d-2)*4)));
  det.travel = d+' mi from '+g.home;
  const n = g.siteHist[sh.site]||0, postW = g.postHist.includes(sh.site+'|'+sh.post);
  f.continuity = Math.min(100, 30 + n*5 + (postW?15:0));
  det.continuity = n ? n+' shifts at site'+(postW?', incl. this post':'') : 'New to this site';
  const avoid = g.avoidSites.includes(sh.site), prefSite = g.prefSites.includes(sh.site);
  f.guardPref = prefSite?100 : avoid?20 : 60;
  det.guardPref = prefSite?'Preferred site' : avoid?'Asked not to work here':'No stated preference';
  const ot = g.otAt;
  f.overtime = projected <= ot-8 ? 100 : projected <= ot ? Math.round(100 - (projected-(ot-8))*2.5) : Math.max(0, Math.round(80 - (projected-ot)*8));
  det.overtime = projected+'h of '+ot+'h before overtime';
  f.shiftPref = g.prefShifts[0]===st ? 100 : g.prefShifts.includes(st) ? 80 : 45;
  det.shiftPref = g.prefShifts.includes(st) ? 'Prefers '+g.prefShifts.join(' / ') : 'Prefers '+g.prefShifts.join(' / ')+', not '+st;
  f.history = Math.round((g.att+g.onTime)/2);
  det.history = g.att+'% attendance, '+g.onTime+'% on time';
  const SR = siteReq(sh.site);
  const needSk = [...new Set(shiftSkills(sh).concat(SR ? SR.skills.map(x=>x.name) : []))], missSk = needSk.filter(k=>!g.skills.includes(k));
  f.skills = needSk.length ? Math.round(100*(needSk.length-missSk.length)/needSk.length) : 100;
  det.skills = !needSk.length ? 'No skills required' : missSk.length ? 'Missing '+missSk.join(', ') : 'Holds '+needSk.join(', ');
  rules.factors.filter(x=>x.custom).forEach(x=>{ const src=CUSTOM_SOURCES[x.source]; f[x.key]=src?src.fn(g):0; det[x.key]=src?src.det(g):'No data source'; });

  const active = activeFactors(rules);
  const wsum = active.reduce((t,x)=>t+x.weight,0);
  const sum = active.reduce((t,x)=>t+f[x.key]*x.weight,0);
  const raw = wsum ? sum/wsum : 0;
  const score = Math.round(raw);

  // ---- warnings ----
  const warnings = [];
  if(d > rules.travelWarn) warnings.push({type:'Long travel distance', text:'Long travel distance: '+d+' mi from home'});
  if(!g.prefShifts.includes(st)) warnings.push({type:'Preference mismatch', text:'Preference mismatch: prefers '+g.prefShifts.join(' / ')+' shifts'});
  if(avoid) warnings.push({type:'Preference mismatch', text:'Preference mismatch: asked not to work at '+site.name});
  if(minRest < rules.restWarn*60) warnings.push({type:'Short rest', text:'Short rest: '+hm(minRest)+' between this and the '+fmtShort(restWith.shift.date)+' '+restWith.shift.start+' shift'});
  if(code==='C' && avPass) warnings.push({type:'On-call', text:'On-call only on '+DOWN[w]+'s — confirm with guard'});

  // ---- reasons ----
  const reasons = [];
  if(avPass) reasons.push(code==='C'?'Available (on-call)':'Available');
  if(!missing.length) reasons.push('Qualification matched'+(prefMet?' + preferred cert':''));
  if(needSk.length && !missSk.length) reasons.push('All required skills ('+needSk.join(', ')+')');
  if(deptHome) reasons.push('Department matched'); else if(deptCross) reasons.push('Cross-trained for department');
  if(!conflict) reasons.push('No schedule conflict');
  if(d<=6) reasons.push('Close to site ('+d+' mi)');
  if(n) reasons.push('Worked at this site before ('+n+' shifts)');
  if(g.prefShifts.includes(st)) reasons.push('Preferred shift ('+st+')');
  if(prefSite) reasons.push('Preferred site');
  if(projected<=ot) reasons.push('Stays within '+ot+'h (no overtime)');
  if(reqMatch.configured && !reqMatch.fails.length) reasons.push(reqMatch.partial ? 'Meets all mandatory post site requirements' : 'Meets all post site requirements');

  // eligible: passes everything. overrideOnly: the ONLY problems are post site requirements that allow a scheduler override.
  const overrideOnly = !eligible && blocking.length>0 && blocking.every(c=>c.psr && c.overridable);
  return { guard:g, shift:sh, eligible, overrideOnly, checks, blocking, reqMatch, factors:f, details:det, activeFactors:active.map(x=>({key:x.key,label:x.label,weight:x.weight,value:f[x.key]})), wsum, sum, raw, score, warnings, reasons, projected, distance:d, shiftType:st };
}

function rank(evals){ return evals.slice().sort((a,b)=> b.score-a.score || b.guard.rating-a.guard.rating || a.distance-b.distance); }

function explainClauses(ev){
  const g=ev.guard, c=[];
  c.push(ev.factors.availability===100?'are available':'are available on call');
  c.push(ev.factors.qualification===100?'are fully qualified':'meet the required qualifications');
  if(!ev.blocking.length) c.push('have no scheduling conflict');
  if(g.siteHist[ev.shift.site]) c.push('have worked '+g.siteHist[ev.shift.site]+' shifts at this site');
  if(ev.distance<=6) c.push('live '+ev.distance+' miles away');
  if(ev.factors.shiftPref===100) c.push('prefer '+ev.shiftType.toLowerCase()+' shifts');
  return c;
}
function joinList(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+', and '+a[a.length-1]; }
function explain(ev, lead){
  let s = (lead || ev.guard.name+' is recommended because they')+' '+joinList(explainClauses(ev))+'.';
  if(ev.warnings.length) s += ' Review '+ev.warnings.length+' warning'+(ev.warnings.length>1?'s':'')+' before applying.';
  return s;
}

/* Stage 1 + 2 for a batch, with joint optimization */
function runBatch(shiftIds, rules){
  const shifts = shiftIds.map(shiftById);
  const base = baseAssignments(shiftIds);
  const active = GUARDS;
  const indep = {};
  shifts.forEach(sh=>{ indep[sh.id] = rank(active.map(g=>evaluate(g,sh,base,rules)).filter(e=>e.eligible)); });
  const order = shifts.slice().sort((a,b)=> indep[a.id].length-indep[b.id].length || range(a)[0]-range(b)[0]);
  const pick = {}, notes = {};
  const ctxWithout = sid => base.concat(Object.entries(pick).filter(([k,v])=>k!==sid && v).map(([k,v])=>({shift:shiftById(k), guardId:v, source:'batch'})));
  // Pass 1: greedy, most-constrained shift first
  for(const sh of order){
    const cands = rank(active.map(g=>evaluate(g,sh,ctxWithout(sh.id),rules)).filter(e=>e.eligible));
    pick[sh.id] = cands.length ? cands[0].guard.id : null;
  }
  // Pass 2+: local improvement with every other recommendation held fixed
  for(let pass=0; pass<4; pass++){
    let changed = false;
    for(const sh of order){
      const cands = rank(active.map(g=>evaluate(g,sh,ctxWithout(sh.id),rules)).filter(e=>e.eligible));
      if(!cands.length) continue;
      const cur = cands.find(c=>c.guard.id===pick[sh.id]);
      if(!cur || cands[0].score > cur.score){ pick[sh.id] = cands[0].guard.id; changed = true; }
    }
    if(!changed) break;
  }
  // Explain where the joint result differs from the independent best
  for(const sh of order){
    const top = indep[sh.id][0];
    if(!top) continue;
    if(!pick[sh.id]){ notes[sh.id] = { kind:'starved', top: top.guard.id }; continue; }
    if(top.guard.id === pick[sh.id]) continue;
    const re = evaluate(top.guard, sh, ctxWithout(sh.id), rules);
    const why = re.blocking[0];
    notes[sh.id] = { top: top.guard.id, topScore: top.score, chosen: pick[sh.id], other: why && why.withId,
      reason: why ? why.blockLabel+': '+why.detail : 'score drops from '+top.score+'% to '+re.score+'% once hours from other recommendations in this run are counted' };
  }
  return { shiftIds: shiftIds.slice(), ai: pick, notes };
}

/* Live evaluation of one result row given other rows' current selections */
function rowEval(run, sid, rules, selection){
  const sh = shiftById(sid);
  const base = baseAssignments(run.shiftIds);
  const others = Object.entries(selection).filter(([k,v])=>k!==sid && v).map(([k,v])=>({shift:shiftById(k), guardId:v, source:'batch'}));
  const live = base.concat(others);
  const all = GUARDS.map(g=>({ base: evaluate(g,sh,base,rules), live: evaluate(g,sh,live,rules) }));
  const eligible = rank(all.filter(x=>x.base.eligible).map(x=>x.live)).map(ev=>({ ev, blockedLive: !ev.eligible }));
  // keep live-eligible first by score, blocked after
  eligible.sort((a,b)=> (a.blockedLive-b.blockedLive) || b.ev.score-a.ev.score);
  const excluded = all.filter(x=>!x.base.eligible).map(x=>x.live);
  return { sh, eligible, excluded };
}

function noEligibleSummary(excluded){
  const counts = {};
  excluded.forEach(ev=>ev.blocking.forEach(c=>{ counts[c.blockLabel]=(counts[c.blockLabel]||0)+1; }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}

if(typeof module!=='undefined') module.exports = { SITE_REQ, checkReq, HARD_TEMPLATES, activeFactors, CUSTOM_SOURCES, SHIFTS, GUARDS, SITES, FACTORS, defaultRules, runBatch, rowEval, evaluate, baseAssignments, shiftById, explain, noEligibleSummary };

/* ---------- results ---------- */
function selectedFor(sid){ return S.sel[sid] || null; }
const MAX_CHOICES = 5;
function rowData(sid){
  const rd = rowEval(S.run, sid, S.rules, S.sel), cur = S.sel[sid];
  const blocked = rd.eligible.filter(x=>x.blockedLive);
  const excluded = rd.excluded.concat(blocked.map(x=>x.ev));
  // AI pick first, then the best alternatives: top 1 + up to 4 (the current selection is always kept)
  const aiId = S.run.ai[sid];
  const ranked = rd.eligible.filter(x=>!x.blockedLive).sort((a,b)=> (b.ev.guard.id===aiId)-(a.ev.guard.id===aiId) || b.ev.score-a.ev.score);
  const eligible = ranked.slice(0, MAX_CHOICES);
  const keep = ranked.slice(MAX_CHOICES).find(x=>x.ev.guard.id===cur); if(keep) eligible.push(keep);
  const override = cur && !eligible.some(x=>x.ev.guard.id===cur) ? excluded.find(e=>e.guard.id===cur)||null : null;
  const conflicts = excluded.filter(e=>e.overrideOnly).sort((a,b)=>b.score-a.score);
  const notEligible = excluded.filter(e=>!e.overrideOnly);
  return { ...rd, eligible, excluded, override, conflicts, notEligible };
}
function selEv(rd, gid){ if(!gid) return null; const x=rd.eligible.find(x=>x.ev.guard.id===gid); return x ? x.ev : (rd.override && rd.override.guard.id===gid ? rd.override : null); }
function rowStatus(sid, rd){
  const gid = selectedFor(sid);
  if(!rd.eligible.length) return {key:'none', html:`<span class="st warn">${ic('alert')}No Eligible Guard</span>`};
  if(!gid) return S.manual[sid]==='skip' ? {key:'skip', html:`<span class="st muted">Left vacant</span>`} : {key:'unres', html:`<span class="st warn">${ic('alert')}Unresolved</span>`};
  const ev = selEv(rd, gid);
  const w = ev ? ev.warnings.length : 0;
  return w ? {key:'warn', warn:w, html:`<span class="st warn">${ic('alert')}Ready · ${w} warning${w>1?'s':''}</span>`} : {key:'ready', html:`<span class="st ok">${ic('check')}Ready</span>`};
}
function resultStats(){
  let ready=0, unres=0, sum=0, hi=0, review=0, manual=0, cnt=0;
  S.run.shiftIds.forEach(sid=>{
    const rd=rowData(sid), gid=selectedFor(sid);
    if(!gid || !S.pick.has(sid)){ unres++; return; }
    const ev=selEv(rd, gid);
    if(!ev){ unres++; return; }
    ready++; sum+=ev.score; cnt++;
    if(ev.score>=80 && !ev.warnings.length) hi++; else review++;
    if(gid!==S.run.ai[sid]) manual++;
  });
  return {total:S.run.shiftIds.length, ready, unres, avg: cnt?Math.round(sum/cnt):0, hi, review, manual};
}

function guardSelectHTML(sid, sh, rd, gid, ev){
  const aiId = S.run.ai[sid];
  const elig = rd.eligible.slice().sort((a,b)=> (b.ev.guard.id===aiId)-(a.ev.guard.id===aiId) || b.ev.score-a.ev.score);
  const o = (val, short, long, sel) => `<option value="${val}" ${sel?'selected':''} data-short="${esc(short)}" data-long="${esc(long)}">${esc(short)}</option>`;
  const none = sh.status==='open' ? 'No Guard (Open)' : 'No Guard (Vacant)';
  const isAI = gid && gid===aiId, isOv = !!(ev && rd.override && rd.override===ev);

  else if(isOv) meta = `<span class="tbadge t-ovr" title="${esc(conflictSentence(ev.guard.name, ev.blocking.filter(b=>b.psr)))}">${ic('alert')}Requirement override</span>${reqChip(ev)}`;
  else meta = `${isAI?'':'<span class="tbadge t-man">Manual choice</span>'}${tierBadge(scoreTier(ev.score))}${reqChip(ev)}${S.run.notes[sid]&&S.run.notes[sid].top&&isAI?`<span class="rowflag">${ic('route')}Optimized</span>`:''}`;
  return `<div class="gsel">${ev?avatar(ev.guard):'<span class="av av-empty">—</span>'}<div class="gs-body">
    <select class="field gs-select ${isAI?'is-ai':''} ${isOv?'is-ov':''}" id="gs-${sid}" data-ch="row-guard" data-sid="${sid}" aria-label="Guard for ${fmtDay(sh.date)} ${sh.start} ${esc(SITES[sh.site].name)}">
      ${elig.length?`<optgroup label="Eligible guards (ranked by AI)">${elig.map(x=>{ const g=x.ev.guard, top=g.id===aiId;
        return o(g.id, (top?'★ ':'')+g.name+' · '+x.ev.score+'%', g.name+' ('+x.ev.score+'% match · '+(top?'AI Recommended':TIERS[tierOf(x)].label)+')', g.id===gid); }).join('')}</optgroup>`:''}
      ${rd.conflicts.length?`<optgroup label="Requirement conflict · override needed">${rd.conflicts.map(e=>{ const n=e.blocking.length;

const REQ_ICON = {ok:'check', partial:'alert', fail:'xcirc', exempt:'check'};
function reqChip(ev){ const m=ev.reqMatch; if(!m||!m.configured) return '';
  const strict=m.hard&&m.hard.length, soft=m.fails.length&&!strict;
  return `<span class="rqc ${strict?'fail':soft||m.partial?'part':'ok'}" title="Post site requirements met: ${m.met} of ${m.total}${soft?' (override available)':strict?' (cannot be overridden)':m.partial?' (missing a preferred skill)':''}">${ic(strict?'xcirc':soft||m.partial?'alert':'check')}Req ${m.met}/${m.total}</span>`; }
function reqBlockHTML(ev, sh){
  const m=ev.reqMatch, site=SITES[sh.site];
  const edit = `<button class="link rq-edit" data-act="ps-from-results" data-site="${sh.site}">${ic('edit')}${m.configured?'Edit':'Set'} requirements</button>`;
  if(!m.configured) return `<div class="rqb none">${ic('sliders')}<span>No post site requirements set for ${esc(site.name)}.</span>${edit}</div>`;

        return `<li class="${i.status==='fail'?'fail':i.status}">${ic(REQ_ICON[i.status])}<b>${esc(i.cat)}</b><span>${esc(i.detail)}${f.some(x=>!x.overridable)?' <em class="ovt no">No override</em>':''}</span></li>`; }).join('')}</ul></div>`;
  }
  return `<div class="rqb ${m.partial?'part':'ok'}"><div class="rqb-h"><b>${m.partial?'':ic('check')}Requirements Match: ${m.met}/${m.total}</b>${m.exempt&&m.exempt.length?`<span class="wc"> · ${m.exempt.length} met by an approved override (${esc(m.exempt.map(f=>f.req).join(', '))})</span>`:m.partial?'<span class="wc"> · partial (preferred skill missing)</span>':'<span class="okc"> · all post site requirements met</span>'}${edit}</div>

function openMenu(type, el, opts={}){
  const r = el.getBoundingClientRect();
  const m = {type, top: Math.min(r.bottom+6, innerHeight-60), ...opts};
  if(opts.alignRight) m.right = Math.max(8, innerWidth - r.right); else m.left = Math.max(8, Math.min(r.left - 8, innerWidth - 300));
  S.menu = m; renderOverlays();
  // keep in viewport vertically
  const el2 = document.querySelector('#menus .menu, #menus .pop');
  if(el2){ const rr = el2.getBoundingClientRect(); if(rr.bottom > innerHeight-8){ S.menu.top = Math.max(8, r.top - rr.height - 6); renderOverlays(); } }
}

    const rk = editRank(s, d);

    const selEv = g ? (rk.elig.find(e=>e.guard.id===g.id) || rk.inel.find(e=>e.guard.id===g.id)) : null;
    const openLabel = s.status==='open' ? 'No Guard (Open)' : s.status==='vacant' ? 'Vacant' : 'Unassign (make Vacant)';
    const optLabel = e => `${e.guard.name} (${e.score}% match · ${top && e.guard.id===top.guard.id ? 'AI Recommended' : TIERS[scoreTier(e.score)].label})`;
    const card = (e, isTop) => {
      const on = d.guardId===e.guard.id, why = d.why===e.guard.id;
      return `<div class="eg-card ${on?'on':''} ${isTop?'top':''}" data-act="ed-pick" data-gid="${e.guard.id}" role="radio" aria-checked="${on}" tabindex="0">
        <div class="eg-row"><span class="radio"></span>${avatar(e.guard)}
          <div class="eg-t"><b><span>${esc(e.guard.name)}</span>${isTop?'<span class="tbadge t-ai">AI Recommended</span>':''}${tierBadge(scoreTier(e.score))}</b>
            <small>${e.distance} mi · ${e.projected}h projected · $${e.guard.rate}/hr${e.warnings.length?` · <span class="wc">${ic('alert')} ${e.warnings.length} warning${e.warnings.length>1?'s':''}</span>`:''}</small></div>
          <span class="os">${e.score}%</span>

        ${why?`<div class="eg-why">${activeFactors(S.rules).map(f=>{ const v=e.factors[f.key]||0; return `<div class="eg-f"><span>${esc(f.label)}<small>${esc(e.details[f.key]||'')}</small></span><div class="bar"><span class="${scoreCls(v)}" style="width:${v}%"></span></div><b>${v}</b></div>`; }).join('')}
          ${e.warnings.length?`<ul class="eg-warn">${e.warnings.map(w=>`<li>${ic('alert','wc')}<span>${esc(w.text)}</span></li>`).join('')}</ul>`:''}</div>`:''}
      </div>`; };
    let elig = '';
    if(selEv && !selEv.eligible){
      elig = `<div class="elig"><b><span class="bc">✕ ${esc(g.name)} fails ${selEv.blocking.length} hard rule${selEv.blocking.length>1?'s':''}</span></b> <span style="color:var(--muted)">· score ${selEv.score}%</span>
      <ul>${selEv.blocking.map(c=>`<li>${ic('xcirc','bc')}<span>${esc(c.label)}: ${esc(c.detail)}${c.psr&&!c.overridable?' · <b>no override</b>':''}</span></li>`).join('')}</ul>
      <div class="note ${selEv.blocking.some(c=>c.psr&&!c.overridable)?'warn':''}">${ic(selEv.blocking.some(c=>c.psr&&!c.overridable)?'alert':'info')}<span>${selEv.blocking.some(c=>c.psr&&!c.overridable)
        ? 'This guard can\'t be assigned: a post site requirement is set to no override.'
        : selEv.blocking.some(c=>c.psr) ? 'Saving asks you to confirm a post site requirement override and give a reason.' : 'You can still save. The assignment will be saved as Unpublished.'}</span></div></div>`; }
    return wrap(head('Edit Shift', `${s.id} · ${esc(SITES[s.site].name)}`)+`<div class="mbd"><div class="form">
      <label>Date<span class="ro">${longDay(s.date)}</span></label><label>Site / Post<span class="ro">${esc(SITES[s.site].name)} · ${esc(s.post)}</span></label>
      <label>Start time<input class="field" type="time" id="ed-start" value="${d.start}" data-ch="ed-start"></label>
      <label>End time<input class="field" type="time" id="ed-end" value="${d.end}" data-ch="ed-end"></label>
      <label class="full">Guard<span class="selwrap">${top && d.guardId===top.guard.id?`<span class="tbadge t-ai sel-tag">AI Recommended</span>`:''}<select class="field" id="ed-guard" data-ch="ed-guard">
        <option value="" ${!d.guardId?'selected':''}>${openLabel}</option>
        ${rk.elig.length?`<optgroup label="Eligible guards (ranked by AI)">${rk.elig.map(e=>`<option value="${e.guard.id}" ${e.guard.id===d.guardId?'selected':''}>${esc(optLabel(e))}</option>`).join('')}</optgroup>`:''}
        ${rk.inel.filter(e=>e.overrideOnly).length?`<optgroup label="Requirement conflict · override needed">${rk.inel.filter(e=>e.overrideOnly).map(e=>`<option value="${e.guard.id}" ${e.guard.id===d.guardId?'selected':''}>⚠ ${esc(e.guard.name)} · ${e.blocking.length} requirement${e.blocking.length===1?'':'s'} not met</option>`).join('')}</optgroup>`:''}
        <optgroup label="Other guards (fail a hard rule)">${rk.inel.filter(e=>!e.overrideOnly).map(e=>{ const strict=e.blocking.some(b=>b.psr&&!b.overridable); return `<option value="${e.guard.id}" ${e.guard.id===d.guardId?'selected':''}>${esc(e.guard.name)} · ${esc((e.blocking[0]||{}).blockLabel||'')}${strict?' (no override)':''}</option>`; }).join('')}</optgroup>
      </select></span></label>
      <label class="full">Requires<span class="ro"><span class="qchips">${s.req.map(q=>`<span class="q">${esc(q)}</span>`).join('')}${s.pref.map(q=>`<span class="q pref">${esc(q)}</span>`).join('')}</span></span></label></div>
      <div class="egbox">
        <div class="eg-h">${ic('spark')}<b>AI Guard Recommendations</b><span>${rk.elig.length} eligible · ${rk.inel.length} excluded by hard rules</span></div>
        ${top?`<div class="eg-sub">Top AI Match${d.auto&&d.guardId===top.guard.id?' · pre-selected':''}</div>${card(top,true)}
          ${rk.elig.length>1?`<button class="eg-sub eg-toggle" data-act="ed-others" aria-expanded="${!d.hideOthers}">${ic(d.hideOthers?'chevR':'chevD')} Other Eligible Guards (${rk.elig.length-1})</button>${d.hideOthers?'':rk.elig.slice(1).map(e=>card(e,false)).join('')}`:''}`
          :`<div class="eg-none">${ic('alert')}<span>No guard passes every active hard rule for this shift. Leave it ${s.status==='vacant'?'vacant':'open'}, or pick a guard from the list above to override.</span></div>`}
        <div class="eg-card open-opt ${!d.guardId?'on':''}" data-act="ed-pick" data-gid="" role="radio" aria-checked="${!d.guardId}" tabindex="0"><div class="eg-row"><span class="radio"></span><div class="eg-t"><b>${openLabel}</b><small>Keep the shift without a guard for now</small></div></div></div>
      </div>${elig}
      ${s.ai?`<div class="note">${ic('spark')}<span>Created by AI Scheduling (score ${s.aiScore}%). Status: ${s.published?'Published':'Unpublished'}.</span></div>`:''}</div>
      <div class="mft"><span class="mft-note left">${d.guardId?`Saving assigns <b>${esc(g.name)}</b> as Unpublished.`:'Saving leaves the shift without a guard.'}</span><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn primary" data-act="edit-save">Save</button></div>`, 'wide edit');
  }
  return '';
}

function guardHistory(g){
  const out = [];
  SHIFTS.filter(s=>s.guardId===g.id && s.status==='assigned' && s.date>='2026-09-26' && s.date<='2026-10-13').forEach(s=>{
    out.push({date:s.date,start:s.start,end:s.end,site:s.site,post:s.post,type:shiftType(s),hours:shHours(s),status:s.date<TODAY?'Completed':'Assigned'});
  });
  const sites = Object.keys(g.siteHist).length ? Object.keys(g.siteHist) : g.cleared;
  const T = {Day:['07:00','15:00'],Evening:['15:00','23:00'],Overnight:['22:00','06:00']}[g.prefShifts[0]];
  for(let i=0;i<5;i++){
    const site = sites[i%sites.length]; const post = (g.postHist.find(p=>p.startsWith(site+'|'))||'|'+SITES[site].posts[0]).split('|')[1];
    const date = addDays('2026-09-25', -i*2-(i%2));
    out.push({date,start:T[0],end:T[1],site,post,type:g.prefShifts[0],hours:8,status:'Completed', flag: (i===2 && g.onTime<92) ? 'Late clock-in 12m' : (i===4 && g.att<90 ? 'Call-off' : '')});
  }
  return out.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}

function renderOverlays(){

/* ---------- AI flow ---------- */
function startRun(ids){
  S.menu=null; S.mode=null; S.selected.clear();
  S.run = runBatch(ids, S.rules);
  S.sel = {...S.run.ai}; S.manual = {}; S.expanded = new Set(); S.focusG = {}; S.showExcl = new Set(); S.showScore = new Set();
  S.pick = new Set(ids.filter(id=>S.sel[id])); S.doneN = 0;
  // expand the first row with a recommendation for a guided review
  S.modal = {type:'processing', step:0, n:ids.length};
  render();
  const tick = () => {
    if(!S.modal || S.modal.type!=='processing') return;
    S.modal.step++;
    if(S.modal.step>=7){ setTimeout(()=>{ A['review-recs'](); }, reduceMotion?50:350); renderOverlays(); return; }
    renderOverlays(); setTimeout(tick, reduceMotion?60:340);
  };
  setTimeout(tick, reduceMotion?60:340);
}
function recalc(msg){
  if(!S.run) return;
  S.run = runBatch(S.run.shiftIds, S.rules);
  S.sel = {...S.run.ai}; S.manual = {}; S.focusG = {};
  toast(msg || 'Rules saved. Recommendations recalculated.');
}
function applyRun(){
  const created = [];
  S.run.shiftIds.forEach(sid=>{
    const gid = selectedFor(sid); if(!gid || !S.pick.has(sid)) return;
    const sh = shiftById(sid); const rd = rowData(sid); const ev = selEv(rd, gid); if(!ev) return;
    created.push({sh, gid, score:ev.score, manual: gid!==S.run.ai[sid], ai:S.run.ai[sid]});
  });
  created.forEach(c=>{ const rec=S.overrides[c.sh.id]; const ex=exemptFor(c.sh.site, c.gid); const used=checkReq(guardById(c.gid), c.sh.site).exempt;
    if(rec && rec.gid===c.gid) c.sh.override=rec; else if(ex && used.length) c.sh.override={gid:c.gid, guardName:guardById(c.gid).name, conflicts:used.map(f=>({cat:f.cat, req:f.req, status:f.status})), reason:ex.reason, note:ex.note, by:ex.by, at:ex.at, standing:true}; else delete c.sh.override; Object.assign(c.sh, {status:'assigned', guardId:c.gid, published:false, ai:true, aiScore:c.score, aiRec:c.ai}); });
  S.lastApplied = created.map(c=>c.sh.id);
  S.applied = (S.applied||[]).concat(S.lastApplied);
  const done = new Set(S.lastApplied);
  S.run.shiftIds = S.run.shiftIds.filter(id=>!done.has(id));
  done.forEach(id=>{ S.pick.delete(id); delete S.sel[id]; S.expanded.delete(id); });
  // guards just assigned may now clash with a remaining row: move those rows to their best remaining guard
  S.run.shiftIds.forEach(sid=>{ const rd=rowData(sid); if(S.sel[sid] && rd.override){ const nx=rd.eligible[0]; S.sel[sid]=nx?nx.ev.guard.id:null; S.run.ai[sid]=S.sel[sid]; if(!nx) S.pick.delete(sid); } });
  return created.length;
}
